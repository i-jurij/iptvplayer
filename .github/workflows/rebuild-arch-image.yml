name: Rebuild arch build image

on:
  # Раз в квартал: 1 января, апреля, июля, октября в 04:00 UTC.
  # Проверяет upstream-сигналы и пересобирает образ, только если они
  # изменились. Не каждый месяц — rolling Arch иногда попадает в
  # нестабильные окна, а debloated-пакеты обновляются не так часто.
  schedule:
    - cron: '0 4 1 1,4,7,10 *'
  # При правках Containerfile или этого workflow — пересобрать безусловно.
  push:
    branches: [main]
    paths:
      - '.github/docker/iptvplayer-arch-build.Containerfile'
      - '.github/workflows/rebuild-arch-image.yml'
  # Ручной запуск для внеплановых случаев (критичные CVE в mpv/ffmpeg и т. п.).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to rebuild
        id: check
        env:
          # При push в Containerfile — пересобираем безусловно.
          # При schedule — только если upstream изменился.
          FORCE_REBUILD: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          IMAGE=$(echo "ghcr.io/${{ github.repository_owner }}/iptvplayer-arch-build" \
                  | tr '[:upper:]' '[:lower:]')
          echo "image_ref=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

          UPSTREAM_UPDATED=$(curl -fsSL \
            "https://api.github.com/repos/pkgforge-dev/archlinux-pkgs-debloated/releases/tags/continuous" \
            | jq -r '.updated_at // "unknown"' || echo "unknown")

          SCRIPT_SHA=$(curl -fsSL \
            "https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/main/useful-tools/get-debloated-pkgs.sh" \
            | sha256sum | awk '{print $1}' || echo "unknown")

          echo "[i] upstream updated_at: $UPSTREAM_UPDATED"
          echo "[i] upstream script sha: $SCRIPT_SHA"

          EXISTING_UPDATED=""
          EXISTING_SHA=""
          if docker pull "$IMAGE:latest" >/dev/null 2>&1; then
            LABELS=$(docker inspect "$IMAGE:latest" \
                     --format '{{json .Config.Labels}}' 2>/dev/null || echo '{}')
            EXISTING_UPDATED=$(echo "$LABELS" | jq -r \
              '."org.iptvplayer.debloated-release-updated" // empty')
            EXISTING_SHA=$(echo "$LABELS" | jq -r \
              '."org.iptvplayer.debloated-script-sha" // empty')
            echo "[i] existing updated_at: ${EXISTING_UPDATED:-<none>}"
            echo "[i] existing script sha: ${EXISTING_SHA:-<none>}"
          else
            echo "[i] образ в GHCR пока не существует"
          fi

          REBUILT="false"
          if [ "${FORCE_REBUILD:-false}" = "true" ]; then
            REBUILT="true"
            echo "[i] push в Containerfile — принудительная пересборка"
          elif [ -z "$EXISTING_UPDATED" ] || [ -z "$EXISTING_SHA" ]; then
            REBUILT="true"
            echo "[i] образ отсутствует — собираем"
          elif [ "$EXISTING_UPDATED" != "$UPSTREAM_UPDATED" ] \
            || [ "$EXISTING_SHA" != "$SCRIPT_SHA" ]; then
            REBUILT="true"
            echo "[i] upstream изменился — собираем"
          else
            echo "[i] образ актуален, пересборка не требуется"
          fi

          {
            echo "rebuilt=$REBUILT"
            echo "upstream_updated=$UPSTREAM_UPDATED"
            echo "script_sha=$SCRIPT_SHA"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.rebuilt == 'true'

      - name: Build and push image
        if: steps.check.outputs.rebuilt == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          file: .github/docker/iptvplayer-arch-build.Containerfile
          push: true
          tags: ${{ steps.check.outputs.image_ref }}
          build-args: |
            DEBLOATED_RELEASE_UPDATED=${{ steps.check.outputs.upstream_updated }}
            DEBLOATED_SCRIPT_SHA=${{ steps.check.outputs.script_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max