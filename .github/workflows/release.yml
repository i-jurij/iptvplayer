name: Release from VERSION

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  workflow_dispatch:
    inputs:
      rebuild_deps:
        description: 'Принудительно пересобрать third_party (игнорировать кэш)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  # =========================================================================
  # 1. Сборка бинарника (один раз, Ubuntu 24.04 — glibc 2.39)
  # =========================================================================
  build-binary:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read_version.outputs.version }}
      version_changed: ${{ steps.check_version_changed.outputs.version_changed }}
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: read_version
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then echo "VERSION missing" >&2; exit 1; fi
          VERSION=$(head -n1 VERSION | tr -d '\n\r')
          [[ -z "$VERSION" ]] && { echo "VERSION empty" >&2; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Ensure git history and tags
        run: |
          set -euo pipefail
          git fetch --prune --unshallow || true
          git fetch --tags

      - name: Ensure VERSION changed
        id: check_version_changed
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git show --name-only --pretty="" "$AFTER" || true)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          fi
          if echo "$CHANGED" | grep -qx "VERSION"; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare git auth for tags
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git"
          git config user.name "CI Bot"
          git config user.email "ci-bot@example.com"

      - name: Create tag if missing
        if: steps.check_version_changed.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git fetch --tags
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag exists"; exit 0
          fi
          git tag -a "${TAG}" -m "Release ${TAG} (CI)"
          git push origin "refs/tags/${TAG}"

      - name: Cache third_party
        if: steps.check_version_changed.outputs.version_changed == 'true'
        uses: actions/cache@v4
        with:
          path: third_party
          key: ${{ runner.os }}-${{ runner.arch }}-third_party-${{ hashFiles('setup-deps.sh') }}

      - name: Install all dependencies
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          chmod +x setup-deps.sh
          if [[ "${{ github.event.inputs.rebuild_deps }}" == "true" ]]; then
            ./setup-deps.sh --yes --rebuild-deps
          else
            ./setup-deps.sh --yes
          fi

      - name: Delete old third_party cache
        if: steps.check_version_changed.outputs.version_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_KEY: ${{ runner.os }}-${{ runner.arch }}-third_party-${{ hashFiles('setup-deps.sh') }}
          KEY_PREFIX: ${{ runner.os }}-${{ runner.arch }}-third_party-
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 || { echo "gh missing"; exit 0; }
          OLD_KEYS=$(gh cache list --repo "$REPO" --limit 100 \
            | awk -v cur="$CURRENT_KEY" -v prefix="$KEY_PREFIX" \
                  '$2 != cur && index($2, prefix) == 1 {print $2}')
          [[ -z "$OLD_KEYS" ]] && { echo "No old caches"; exit 0; }
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            gh cache delete "$key" --repo "$REPO" || true
          done <<< "$OLD_KEYS"

      - name: Build binary
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          chmod +x build-release.sh
          ./build-release.sh --type release --prefix "$PWD/install" --yes

      - name: Compute .deb dependencies
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev >/dev/null
          TMP="$(mktemp -d)"; mkdir -p "$TMP/debian"
          cat > "$TMP/debian/control" <<'EOF'
          Source: iptvplayer
          Package: iptvplayer
          Architecture: any
          EOF
          BIN="$PWD/install/bin/iptvplayer"
          DEPS=$(cd "$TMP" && dpkg-shlibdeps -O "$BIN" 2>/dev/null \
            | sed -n 's/^shlibs:Depends=//p' | tr -d '\n\r' || true)
          rm -rf "$TMP"
          [[ -z "$DEPS" ]] && echo "::warning::dpkg-shlibdeps пустой"
          echo "$DEPS" > "$PWD/install/DEB_DEPENDS"

      - name: Upload install artifact
        if: steps.check_version_changed.outputs.version_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: install
          path: install/
          retention-days: 1
          if-no-files-found: error

  # =========================================================================
  # 2. Bundled .deb + .rpm + AppImage
  # =========================================================================
  package:
    needs: build-binary
    if: needs.build-binary.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: actions/cache@v4
        with:
          path: third_party
          key: ${{ runner.os }}-${{ runner.arch }}-third_party-${{ hashFiles('setup-deps.sh') }}

      - name: Install packaging tools + runtime libs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake dpkg-dev rpm gnupg debsigs file tar wget xz-utils \
            libmpv2 libgtk-3-0t64 libcurl4t64 libjpeg-turbo8 libexpat1 zlib1g
          chmod +x setup-deps.sh
          ./setup-deps.sh --yes

      - uses: actions/download-artifact@v4
        with:
          name: install
          path: install

      - name: Import GPG key
        id: import_gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "can_sign=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"
          echo "pinentry-mode loopback" >> "$GNUPGHOME/gpg.conf"
          : > "$GNUPGHOME/.passphrase"; chmod 600 "$GNUPGHOME/.passphrase"
          echo "passphrase-file $GNUPGHOME/.passphrase" >> "$GNUPGHOME/gpg.conf"
          gpgconf --kill gpg-agent 2>/dev/null || true
          gpg-connect-agent /bye 2>/dev/null || true
          REAL_GPG="$(command -v gpg)"
          WRAPPER_DIR="$(mktemp -d)"
          cat > "$WRAPPER_DIR/gpg" <<WRAPPER
          #!/bin/bash
          exec "$REAL_GPG" --batch --pinentry-mode loopback --passphrase '' "\$@"
          WRAPPER
          chmod +x "$WRAPPER_DIR/gpg"
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          [ -z "$GPG_KEY_ID" ] && { echo "::error::no secret key"; exit 1; }
          echo "GNUPGHOME=$GNUPGHOME"           >> $GITHUB_ENV
          echo "GPG_KEY_ID=$GPG_KEY_ID"         >> $GITHUB_ENV
          echo "GPG_WRAPPER_DIR=$WRAPPER_DIR"   >> $GITHUB_ENV
          echo "PATH=$WRAPPER_DIR:$PATH"        >> $GITHUB_ENV
          echo "can_sign=true"                  >> $GITHUB_OUTPUT

      - name: Build bundled packages + AppImage
        run: |
          set -euo pipefail
          mkdir -p logs
          chmod +x build-package.sh
          ./build-package.sh --bundle-deb --bundle-rpm --appimage --yes 2>&1 | tee logs/build-package.log

      - name: Export public key
        if: always() && steps.import_gpg.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          gpg --armor --export "$GPG_KEY_ID" > dist/public-key.asc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: |
            dist/*
            logs/build-package.log
          retention-days: 1
          if-no-files-found: warn

      - name: Cleanup GNUPGHOME
        if: always()
        run: |
          [ -n "${GNUPGHOME:-}" ] && rm -rf "$GNUPGHOME" || true

  # =========================================================================
  # 3. Smoke-test bundled .deb/.rpm
  # =========================================================================
  smoke-test-packages:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { container: 'ubuntu:26.04',             type: deb }
          - { container: 'debian:13',                type: deb }
          - { container: 'fedora:44',                type: rpm }
          - { container: 'rockylinux/rockylinux:10', type: rpm }
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: .

      - name: Install and ldd
        run: |
          set -euo pipefail
          if [ "${{ matrix.type }}" = "deb" ]; then
            apt-get update -qq
            apt-get install -y ./dist/*.deb
          else
            dnf install -y ./dist/*.rpm
          fi
          echo "=== ldd /opt/iptvplayer/usr/bin/iptvplayer ==="
          if ldd /opt/iptvplayer/usr/bin/iptvplayer 2>&1 | grep -q "not found"; then
            ldd /opt/iptvplayer/usr/bin/iptvplayer | grep "not found"
            exit 1
          fi
          echo "OK"

  # =========================================================================
  # 4. Smoke-test AppImage
  # =========================================================================
  smoke-test-appimage:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { container: 'ubuntu:26.04',             label: 'target' }
          - { container: 'debian:13',                label: 'target' }
          - { container: 'fedora:44',                label: 'target' }
          - { container: 'rockylinux/rockylinux:10', label: 'target' }
          - { container: 'archlinux:latest',         label: 'rolling' }
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: .

      - name: Install minimal tools
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates file xz-utils
          elif command -v dnf >/dev/null; then
            dnf install -y ca-certificates file xz
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm ca-certificates file xz
          fi

      - name: Extract and check ldd
        run: |
          set -euo pipefail
          APPIMAGE=$(ls dist/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          BIN="squashfs-root/AppRun"
          [ -f "$BIN" ] || BIN="squashfs-root/usr/bin/iptvplayer"
          if ldd "$BIN" 2>&1 | grep -q "not found"; then
            ldd "$BIN" | grep "not found"
            exit 1
          fi
          echo "OK"

  # =========================================================================
  # 5. Публикация
  # =========================================================================
  release:
    needs: [build-binary, package, smoke-test-packages, smoke-test-appimage]
    if: |
      always() &&
      needs.build-binary.result == 'success' &&
      needs.build-binary.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: .

      - name: Check artifacts
        id: check_artifacts
        run: |
          set -euo pipefail
          ls -la dist/ || true
          shopt -s nullglob
          pkgs=(dist/*.deb dist/*.rpm dist/*.AppImage)
          if (( ${#pkgs[@]} > 0 )); then
            echo "have_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "have_artifacts=false" >> $GITHUB_OUTPUT
          fi

      - name: Compose release body
        id: body
        run: |
          set -euo pipefail
          BODY="Automated release for v${{ needs.build-binary.outputs.version }} (commit ${{ github.sha }})"
          if [ "${{ needs.smoke-test-packages.result }}" != "success" ]; then
            BODY="$BODY"$'\n\n'"⚠️ **Smoke-test .deb/.rpm не прошёл.** См. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          if [ "${{ needs.smoke-test-appimage.result }}" != "success" ]; then
            BODY="$BODY"$'\n\n'"⚠️ **Smoke-test AppImage не прошёл.** См. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          BODY="$BODY"$'\n\n'"---"$'\n\n'"**Бинарник собран на Ubuntu 24.04 (glibc >= 2.39).**"$'\n'"- Ubuntu 24.04+, Debian 13+: \`.deb\`"$'\n'"- Fedora 44+, Rocky 10+: \`.rpm\`"$'\n'"- Любая система с glibc >= 2.39: \`AppImage\`"
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_artifacts.outputs.have_artifacts == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', needs.build-binary.outputs.version) }}
          name: Release v${{ needs.build-binary.outputs.version }}
          body: ${{ steps.body.outputs.body }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.zsync
            dist/*.asc
            dist/checksums.txt
            dist/public-key.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}