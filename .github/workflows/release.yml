name: Release from VERSION

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: read_version
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then
            echo "VERSION file missing" >&2
            exit 1
          fi
          VERSION=$(head -n1 VERSION | tr -d '\n\r')
          if [[ -z "$VERSION" ]]; then
            echo "VERSION is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Read VERSION=$VERSION"

      - name: Ensure git history and tags present
        run: |
          set -euo pipefail
          git fetch --prune --unshallow || true
          git fetch --tags

      - name: Ensure VERSION changed in this push
        id: check_version_changed
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          echo "Range before..after: $BEFORE .. $AFTER"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git show --name-only --pretty="" "$AFTER" || true)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          fi

          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qx "VERSION"; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare git auth for pushing tags
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git"
          git config user.name "CI Bot"
          git config user.email "ci-bot@example.com"
          echo "Prepared remote with token"

      - name: Create annotated tag if missing
        if: steps.check_version_changed.outputs.version_changed == 'true'
        id: create_tag
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          echo "Target tag: ${TAG}"
          git fetch --tags
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} exists on origin. Skipping."
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Local tag ${TAG} exists; pushing to origin."
            git push origin "refs/tags/${TAG}"
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git tag -a "${TAG}" -m "Release ${TAG} (CI)"
          git push origin "refs/tags/${TAG}"
          echo "created=true" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Tag ${TAG} created and pushed."

      # ------------------ CACHE third_party START ------------------

      - name: Cache third_party dependencies
        if: steps.check_version_changed.outputs.version_changed == 'true'
        uses: actions/cache@v4
        with:
          path: third_party
          key: ${{ runner.os }}-third_party-${{ hashFiles('setup-deps.sh') }}
          restore-keys: |
            ${{ runner.os }}-third_party-

      # ------------------ CACHE third_party END ------------------

      - name: Install deps (including GTK dev)
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential fakeroot dpkg-dev rpm wget tar autoconf automake libtool \
            pkg-config \
            libgtk-3-dev libglib2.0-dev libgdk-pixbuf2.0-dev libatk1.0-dev libpango1.0-dev libcairo2-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxss-dev libxcursor-dev libxcomposite-dev libxdamage-dev libxfixes-dev libxrender-dev

      - name: Build third-party deps (with full logs)
        if: steps.check_version_changed.outputs.version_changed == 'true'
        id: build_third
        run: |
          set -euo pipefail
          set -x
          mkdir -p build_logs
          echo "=== WORKDIR ==="
          pwd
          echo "=== LS repo root ==="
          ls -la
          if [[ -f setup-deps.sh ]]; then
            ls -la setup-deps.sh
            head -n 80 setup-deps.sh || true
            chmod +x setup-deps.sh || true
            ./setup-deps.sh > build_logs/setup-deps.out 2>&1 || true
            echo "=== tail of setup-deps.out ==="
            tail -n 500 build_logs/setup-deps.out || true
            # If script failed, exit non-zero to stop pipeline
            if ! grep -q -E "error|failed|ERROR|FAILED" build_logs/setup-deps.out 2>/dev/null; then
              echo "setup-deps.sh appears to have completed without obvious errors (no ERROR/failed keywords)."
            else
              echo "setup-deps.sh produced error keywords; failing step to upload logs."
              exit 3
            fi
          else
            echo "setup-deps.sh not found" >&2
            exit 2
          fi
        shell: bash

      - name: Upload third-party build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: third-party-build-logs
          path: build_logs

      - name: Build packages
        if: steps.check_version_changed.outputs.version_changed == 'true' && steps.build_third.outcome == 'success'
        run: |
          chmod +x build-package.sh
          ./build-package.sh --all

      - name: Generate checksums
        if: steps.check_version_changed.outputs.version_changed == 'true' && steps.build_third.outcome == 'success'
        run: |
          mkdir -p dist || true
          sha256sum dist/* > dist/checksums.txt || true
          cat dist/checksums.txt || true

      - name: Create GitHub Release and upload artifacts
        if: steps.check_version_changed.outputs.version_changed == 'true' && steps.build_third.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', steps.read_version.outputs.version) }}
          name: Release v${{ steps.read_version.outputs.version }}
          body: "Automated release for version v${{ steps.read_version.outputs.version }} (commit ${{ github.sha }})"
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
