name: Release from VERSION

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  workflow_dispatch:
    inputs:
      rebuild_deps:
        description: 'Принудительно пересобрать third_party (игнорировать кэш)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  # =========================================================================
  # 1. Сборка бинарника (один раз, Ubuntu 24.04 — glibc 2.39)
  # =========================================================================
  build-binary:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read_version.outputs.version }}
      version_changed: ${{ steps.check_version_changed.outputs.version_changed }}
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: read_version
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then echo "VERSION missing" >&2; exit 1; fi
          VERSION=$(head -n1 VERSION | tr -d '\n\r')
          [[ -z "$VERSION" ]] && { echo "VERSION empty" >&2; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Ensure git history and tags
        run: |
          set -euo pipefail
          git fetch --prune --unshallow || true
          git fetch --tags

      - name: Ensure VERSION changed
        id: check_version_changed
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git show --name-only --pretty="" "$AFTER" || true)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          fi
          if echo "$CHANGED" | grep -qx "VERSION"; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare git auth for tags
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git"
          git config user.name "CI Bot"
          git config user.email "ci-bot@example.com"

      - name: Create tag if missing
        if: steps.check_version_changed.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git fetch --tags
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag exists"; exit 0
          fi
          git tag -a "${TAG}" -m "Release ${TAG} (CI)"
          git push origin "refs/tags/${TAG}"

      - name: Cache third_party
        if: steps.check_version_changed.outputs.version_changed == 'true'
        uses: actions/cache@v5
        with:
          path: third_party
          key: ${{ runner.os }}-${{ runner.arch }}-third_party-${{ hashFiles('scripts/setup-deps.sh') }}

      - name: Install all dependencies
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/setup-deps.sh
          if [[ "${{ github.event.inputs.rebuild_deps }}" == "true" ]]; then
            ./scripts/setup-deps.sh --yes --rebuild-deps
          else
            ./scripts/setup-deps.sh --yes
          fi

      - name: Delete old third_party cache
        if: steps.check_version_changed.outputs.version_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_KEY: ${{ runner.os }}-${{ runner.arch }}-third_party-${{ hashFiles('scripts/setup-deps.sh') }}
          KEY_PREFIX: ${{ runner.os }}-${{ runner.arch }}-third_party-
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 || { echo "gh missing"; exit 0; }
          OLD_KEYS=$(gh cache list --repo "$REPO" --limit 100 \
            | awk -v cur="$CURRENT_KEY" -v prefix="$KEY_PREFIX" \
                  '$2 != cur && index($2, prefix) == 1 {print $2}')
          [[ -z "$OLD_KEYS" ]] && { echo "No old caches"; exit 0; }
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            gh cache delete "$key" --repo "$REPO" || true
          done <<< "$OLD_KEYS"

      - name: Build binary
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh --type release --prefix "$PWD/install" --yes

      - name: Compute .deb dependencies
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev >/dev/null
          TMP="$(mktemp -d)"; mkdir -p "$TMP/debian"
          cat > "$TMP/debian/control" <<'EOF'
          Source: iptvplayer
          Package: iptvplayer
          Architecture: any
          EOF
          BIN="$PWD/install/bin/iptvplayer"
          DEPS=$(cd "$TMP" && dpkg-shlibdeps -O "$BIN" 2>/dev/null \
            | sed -n 's/^shlibs:Depends=//p' | tr -d '\n\r' || true)
          rm -rf "$TMP"
          [[ -z "$DEPS" ]] && echo "::warning::dpkg-shlibdeps пустой"
          echo "$DEPS" > "$PWD/install/DEB_DEPENDS"

      - name: Upload install artifact
        if: steps.check_version_changed.outputs.version_changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: install
          path: install/
          retention-days: 1
          if-no-files-found: error

  # =========================================================================
  # 2. Bundled .deb + .rpm + AppImage
  # =========================================================================
  package:
    needs: build-binary
    if: needs.build-binary.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: third_party
          key: ${{ runner.os }}-${{ runner.arch }}-third_party-${{ hashFiles('scripts/setup-deps.sh') }}

      - name: Install packaging tools + runtime libs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake dpkg-dev rpm gnupg debsigs file tar wget xz-utils \
            patchelf \
            libmpv2 libgtk-3-0t64 libgdk-pixbuf2.0-bin libcurl4t64 libjpeg-turbo8 libexpat1 zlib1g
          chmod +x scripts/setup-deps.sh
          ./scripts/setup-deps.sh --yes

      - uses: actions/download-artifact@v5
        with:
          name: install
          path: install

      - name: Import GPG key
        id: import_gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          # --- Проверки: без ключа и без пароля подписывать нечем ---
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "can_sign=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "::warning::GPG_PASSPHRASE не задан — релиз будет без подписи"
            echo "can_sign=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # --- Всё временное — в память (tmpfs), не на диск ---
          export TMPDIR=/dev/shm

          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"

          # Конфиги — ДО первого вызова gpg, иначе агент стартует с дефолтами.
          cat > "$GNUPGHOME/gpg.conf" <<'EOF'
          batch
          no-tty
          pinentry-mode loopback
          EOF

          cat > "$GNUPGHOME/gpg-agent.conf" <<'EOF'
          allow-loopback-pinentry
          pinentry-program /bin/false
          EOF

          gpgconf --kill gpg-agent 2>/dev/null || true
          gpg-connect-agent /bye 2>/dev/null || true

          # --- Импорт приватного ключа (passphrase при импорте не нужен) ---
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase-file /dev/null \
            --import

          # Перезапустить агента, чтобы он перечитал gpg-agent.conf.
          gpgconf --kill gpg-agent 2>/dev/null || true
          gpg-connect-agent /bye 2>/dev/null || true

          # --- Wrapper gpg с реальной passphrase ---
          # PASSFILE лежит внутри WRAPPER_DIR: живёт столько же, сколько wrapper.
          # Никакого trap — иначе файл удалится при выходе из этого шага,
          # а wrapper понадобится в следующем шаге (build-package.sh).
          REAL_GPG="$(command -v gpg)"

          WRAPPER_DIR="$(mktemp -d)"
          chmod 700 "$WRAPPER_DIR"

          PASSFILE="$WRAPPER_DIR/pass"
          printf '%s' "$GPG_PASSPHRASE" > "$PASSFILE"
          chmod 600 "$PASSFILE"

          cat > "$WRAPPER_DIR/gpg" <<WRAPPER
          #!/bin/bash
          exec "$REAL_GPG" --batch --no-tty \
            --pinentry-mode loopback \
            --passphrase-file "$PASSFILE" "\$@"
          WRAPPER
          chmod +x "$WRAPPER_DIR/gpg"

          # --- Определить ключ ---
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          if [ -z "$GPG_KEY_ID" ]; then
            echo "::warning::no secret key — релиз будет без подписи"
            echo "can_sign=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # --- Self-test: если подпись не удалась — релиз без подписи, но не падаем ---
          if ! echo test | "$WRAPPER_DIR/gpg" --local-user "$GPG_KEY_ID" \
                 --detach-sign -o /dev/null; then
            echo "::warning::signing self-test failed — релиз будет без подписи"
            echo "can_sign=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # --- Экспорт окружения для следующих шагов ---
          echo "GNUPGHOME=$GNUPGHOME"           >> $GITHUB_ENV
          echo "GPG_KEY_ID=$GPG_KEY_ID"         >> $GITHUB_ENV
          echo "GPG_WRAPPER_DIR=$WRAPPER_DIR"   >> $GITHUB_ENV
          echo "$WRAPPER_DIR"                   >> $GITHUB_PATH
          echo "can_sign=true"                  >> $GITHUB_OUTPUT

      - name: Build bundled packages + AppImage
        run: |
          set -euo pipefail
          mkdir -p logs
          chmod +x scripts/build-package.sh
          ./scripts/build-package.sh --bundle-deb --bundle-rpm --appimage --sharun --yes 2>&1 | tee logs/build-package.log

      - name: Export public key
        if: always() && steps.import_gpg.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          gpg --armor --export "$GPG_KEY_ID" > dist/public-key.asc

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: packages
          path: |
            dist/*
            logs/build-package.log
          retention-days: 1
          if-no-files-found: warn

      - name: Cleanup GNUPGHOME and gpg wrapper
        if: always()
        run: |
          rm -rf "${GNUPGHOME:-}"       2>/dev/null || true
          rm -rf "${GPG_WRAPPER_DIR:-}" 2>/dev/null || true

  # =========================================================================
  # 3. Публикация
  # =========================================================================
  release:
    needs: [build-binary, package]
    if: |
      always() &&
      needs.build-binary.result == 'success' &&
      needs.build-binary.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: packages
          path: .

      - name: Check artifacts
        id: check_artifacts
        run: |
          set -euo pipefail
          ls -la dist/ || true
          shopt -s nullglob
          pkgs=(dist/*.deb dist/*.rpm dist/*.AppImage)
          if (( ${#pkgs[@]} > 0 )); then
            echo "have_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "have_artifacts=false" >> $GITHUB_OUTPUT
          fi

      - name: Compose release body
        id: body
        run: |
          set -euo pipefail
          BODY="Release v${{ needs.build-binary.outputs.version }} (commit ${{ github.sha }})"
          BODY="$BODY"$'\n\n'"Built on Ubuntu 24.04 (glibc >= 2.39)."
          BODY="$BODY"$'\n\n'"- \`.deb\` — Ubuntu 24.04+, Debian 13+"
          BODY="$BODY"$'\n'"- \`.rpm\` — Fedora 44+, Rocky 10+"
          BODY="$BODY"$'\n'"- \`*.AppImage\` — any glibc >= 2.39 (linuxdeploy). Follows system GTK theme, or Adwaita light/dark if none."
          BODY="$BODY"$'\n'"- \`*-sharun.AppImage\` — any Linux, incl. old glibc, musl, NixOS (Adwaita light/dark)."
          BODY="$BODY"$'\n\n'"Both AppImages support auto-update via embedded update information."
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_artifacts.outputs.have_artifacts == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', needs.build-binary.outputs.version) }}
          name: Release v${{ needs.build-binary.outputs.version }}
          body: ${{ steps.body.outputs.body }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.zsync
            dist/*.asc
            dist/checksums.txt
            dist/public-key.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}