name: Release from VERSION

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: read_version
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then
            echo "VERSION file missing" >&2
            exit 1
          fi
          VERSION=$(head -n1 VERSION | tr -d '\n\r')
          if [[ -z "$VERSION" ]]; then
            echo "VERSION is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Read VERSION=$VERSION"

      - name: Ensure git history and tags present
        run: |
          set -euo pipefail
          git fetch --prune --unshallow || true
          git fetch --tags

      - name: Ensure VERSION changed in this push
        id: check_version_changed
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git show --name-only --pretty="" "$AFTER" || true)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          fi
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qx "VERSION"; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare git auth for pushing tags
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git"
          git config user.name "CI Bot"
          git config user.email "ci-bot@example.com"

      - name: Create annotated tag if missing
        if: steps.check_version_changed.outputs.version_changed == 'true'
        id: create_tag
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git fetch --tags
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} exists on origin. Skipping."
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            git push origin "refs/tags/${TAG}"
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git tag -a "${TAG}" -m "Release ${TAG} (CI)"
          git push origin "refs/tags/${TAG}"
          echo "created=true" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      # ---- Кэширование third_party (для ускорения сборки) ----
      - name: Cache third_party dependencies
        if: steps.check_version_changed.outputs.version_changed == 'true'
        uses: actions/cache@v4
        with:
          path: third_party
          key: ${{ runner.os }}-third_party-${{ hashFiles('setup-deps.sh') }}
          restore-keys: |
            ${{ runner.os }}-third_party-

      # ---- Установка всех зависимостей через setup-deps.sh ----
      - name: Install all dependencies (system packages + third_party libs)
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          chmod +x setup-deps.sh
          ./setup-deps.sh --yes

      # ---- Сборка пакетов ----
      - name: Build packages
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          chmod +x build-package.sh
          ./build-package.sh --all

      # ---- Подпись и контрольные суммы ----
      - name: Import GPG key
        if: steps.check_version_changed.outputs.version_changed == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
            echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
            gpg-connect-agent reloadagent /bye || true
            GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec' | head -1 | cut -d: -f5)
            echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV
            echo "::notice::GPG key imported, ID: $GPG_KEY_ID"
          else
            echo "::warning::No GPG private key found in secrets, skipping signing."
          fi

      - name: Export public key
        if: steps.check_version_changed.outputs.version_changed == 'true' && env.GPG_KEY_ID != ''
        run: |
          gpg --armor --export "$GPG_KEY_ID" > dist/public-key.asc
          echo "Public key exported to dist/public-key.asc"

      - name: Generate checksums and sign
        if: steps.check_version_changed.outputs.version_changed == 'true'
        env:
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd dist
          sha256sum * > checksums.txt 2>/dev/null || true
          if [ -n "$GPG_KEY_ID" ] && command -v gpg >/dev/null; then
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --detach-sign --armor --local-user "$GPG_KEY_ID" checksums.txt
          fi
          cd ..

      - name: Create GitHub Release and upload artifacts
        if: steps.check_version_changed.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', steps.read_version.outputs.version) }}
          name: Release v${{ steps.read_version.outputs.version }}
          body: "Automated release for version v${{ steps.read_version.outputs.version }} (commit ${{ github.sha }})"
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}