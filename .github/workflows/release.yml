name: Release from VERSION

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  workflow_dispatch:
    inputs:
      rebuild_deps:
        description: 'Принудительно пересобрать third_party (игнорировать кэш)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  # =========================================================================
  # 1. Версия + тег. Сборкой не занимается.
  # =========================================================================
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read_version.outputs.version }}
      version_changed: ${{ steps.check_version_changed.outputs.version_changed }}
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: read_version
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then echo "VERSION missing" >&2; exit 1; fi
          VERSION=$(head -n1 VERSION | tr -d '\n\r')
          [[ -z "$VERSION" ]] && { echo "VERSION empty" >&2; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Ensure git history and tags
        run: |
          set -euo pipefail
          git fetch --prune --unshallow || true
          git fetch --tags

      - name: Ensure VERSION changed
        id: check_version_changed
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git show --name-only --pretty="" "$AFTER" || true)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          fi
          if echo "$CHANGED" | grep -qx "VERSION"; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare git auth for tags
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git"
          git config user.name "CI Bot"
          git config user.email "ci-bot@example.com"

      - name: Create tag if missing
        if: steps.check_version_changed.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git fetch --tags
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag exists"; exit 0
          fi
          git tag -a "${TAG}" -m "Release ${TAG} (CI)"
          git push origin "refs/tags/${TAG}"

  # =========================================================================
  # 2. AppImage (linuxdeploy + sharun) на Ubuntu 24.04
  # =========================================================================
  appimage:
    needs: version
    if: needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    env:
      REBUILD_DEPS: ${{ github.event.inputs.rebuild_deps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: third_party
          key: ${{ runner.os }}-${{ runner.arch }}-appimage-third_party-${{ hashFiles('scripts/setup-deps.sh') }}

      - name: Install packaging tools + runtime libs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake gnupg file tar wget xz-utils patchelf \
            libmpv2 libgtk-3-0t64 libgdk-pixbuf2.0-bin \
            libcurl4t64 libjpeg-turbo8 libexpat1 zlib1g
          chmod +x scripts/setup-deps.sh
          if [[ "${REBUILD_DEPS:-}" == "true" ]]; then
            ./scripts/setup-deps.sh --yes --rebuild-deps
          else
            ./scripts/setup-deps.sh --yes
          fi

      - name: Build AppImages
        run: |
          # -e здесь намеренно НЕ ставим: rc обоих запусков собираем вручную,
          # иначе первое падение убило бы шаг до попытки собрать второй вариант.
          set -uo pipefail

          mkdir -p logs
          chmod +x scripts/build-package.sh

          rc_lld=0
          rc_sharun=0

          ./scripts/build-package.sh --appimage --yes 2>&1 \
            | tee logs/build-package.log || rc_lld=$?

          ./scripts/build-package.sh --sharun   --yes 2>&1 \
            | tee -a logs/build-package.log || rc_sharun=$?

          shopt -s nullglob
          imgs=(dist/*.AppImage)

          if (( ${#imgs[@]} == 0 )); then
            echo "::error::ни одного AppImage не собралось (linuxdeploy rc=$rc_lld, sharun rc=$rc_sharun)"
            exit 1
          fi

          (( rc_lld    != 0 )) && echo "::warning::linuxdeploy AppImage не собрался (rc=$rc_lld)"
          (( rc_sharun != 0 )) && echo "::warning::sharun AppImage не собрался (rc=$rc_sharun)"

          printf 'собрано AppImage: %d\n' "${#imgs[@]}"
          printf '  %s\n' "${imgs[@]}"

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: packages
          path: dist/
          retention-days: 1
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: appimage-build-log
          path: logs/build-package.log
          retention-days: 1
          if-no-files-found: ignore

  # =========================================================================
  # 3. Нативные .deb / .rpm — каждый в своём контейнере
  # =========================================================================
  native-packages:
    needs: version
    if: needs.version.outputs.version_changed == 'true'
    uses: ./.github/workflows/native-packages.yml
    with:
      targets: '["ubuntu-24.04","debian-13","rocky-10"]'
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}

  # =========================================================================
  # 4. Публикация: подпись + checksums + релиз
  # =========================================================================
  release:
    needs: [version, appimage, native-packages]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      # Локальный composite action ./.github/actions/import-gpg доступен
      # только после checkout. Артефакты потом распакуются в dist/ поверх
      # чистого workspace — дист в репо не хранится, конфликта нет.
      - uses: actions/checkout@v5
        
      - name: Download AppImage
        continue-on-error: true
        uses: actions/download-artifact@v5
        with: { name: packages, path: dist }

      - name: Download all native packages
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Import GPG key
        id: gpg
        uses: ./.github/actions/import-gpg
        with:
          private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase:  ${{ secrets.GPG_PASSPHRASE }}

      # Пакеты уже подписаны в build-jobs (debsigs для .deb,
      # rpm --addsign для .rpm, detached .asc для AppImage).
      # Здесь мы только отдаём публичный ключ и подписываем checksums.txt.
      - name: Export public key
        if: steps.gpg.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          gpg --armor --export "$GPG_KEY_ID" > dist/public-key.asc

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=()
          for f in *; do
            case "$f" in
              checksums.txt|checksums.txt.asc|public-key.asc) continue ;;
            esac
            [ -f "$f" ] || continue
            files+=("$f")
          done
          (( ${#files[@]} > 0 )) && sha256sum "${files[@]}" > checksums.txt || :
          cd -

      - name: Sign checksums
        if: steps.gpg.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          gpg --yes --detach-sign --armor -u "$GPG_KEY_ID" \
            -o dist/checksums.txt.asc dist/checksums.txt || true

      - name: Check artifacts
        id: check
        run: |
          set -euo pipefail
          echo "=== dist/ ==="
          ls -la dist/ 2>/dev/null || true
          echo ""

          shopt -s nullglob

          lld=(); for f in dist/*.AppImage; do
            [[ "$f" == *-sharun.AppImage ]] && continue
            lld+=("$f")
          done
          sharun=(dist/*-sharun.AppImage)
          deb=(dist/*.deb)
          rpm=(dist/*.rpm)

          # Разделяем .deb по дистрибутиву (ubuntu-*, debian-*)
          deb_ubuntu_count=0
          deb_ubuntu_distros=""
          deb_debian_count=0
          deb_debian_distros=""
          for f in "${deb[@]}"; do
            b=$(basename "$f" .deb)
            d="${b%_*}"; d="${d##*_}"
            case "$d" in
              ubuntu-*)
                deb_ubuntu_count=$((deb_ubuntu_count + 1))
                deb_ubuntu_distros+="${d}, " ;;
              debian-*)
                deb_debian_count=$((deb_debian_count + 1))
                deb_debian_distros+="${d}, " ;;
            esac
          done
          deb_ubuntu_distros="${deb_ubuntu_distros%, }"
          deb_debian_distros="${deb_debian_distros%, }"

          # Разделяем .rpm по дистрибутиву
          rpm_distros=""
          for f in "${rpm[@]}"; do
            b=$(basename "$f" .rpm)
            d="${b%.*}"; d="${d##*.}"
            rpm_distros+="${d}, "
          done
          rpm_distros="${rpm_distros%, }"

          echo "AppImage(linuxdeploy): ${#lld[@]}"
          echo "AppImage(sharun):      ${#sharun[@]}"
          echo ".deb (Ubuntu):         ${deb_ubuntu_count}  [${deb_ubuntu_distros}]"
          echo ".deb (Debian):         ${deb_debian_count}  [${deb_debian_distros}]"
          echo ".rpm:                  ${#rpm[@]}  [${rpm_distros}]"

          have_lld=false; (( ${#lld[@]}    > 0 )) && have_lld=true
          have_shr=false; (( ${#sharun[@]} > 0 )) && have_shr=true

          {
            echo "have_linuxdeploy=$have_lld"
            echo "have_sharun=$have_shr"
            echo "deb_ubuntu_count=$deb_ubuntu_count"
            echo "deb_ubuntu_distros=$deb_ubuntu_distros"
            echo "deb_debian_count=$deb_debian_count"
            echo "deb_debian_distros=$deb_debian_distros"
            echo "rpm_count=${#rpm[@]}"
            echo "rpm_distros=$rpm_distros"
          } >> $GITHUB_OUTPUT

          # Релиз создаётся, если собран хотя бы один артефакт любого типа.
          # Что именно не собралось — видно в таблице release body. Единственный
          # случай, когда релиз не имеет смысла, — не собралось совсем ничего.
          total=$(( ${#lld[@]} + ${#sharun[@]} + ${#deb[@]} + ${#rpm[@]} ))
          if (( total > 0 )); then
            echo "have_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "have_artifacts=false" >> $GITHUB_OUTPUT
            echo "::error::не собралось ни одного артефакта — релиз не создаётся"
          fi

      - name: Compose release body
        id: body
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"

          mark() { [[ "$1" == "true" ]] && printf '✅' || printf '❌'; }
          LLD=$(mark "${{ steps.check.outputs.have_linuxdeploy }}")
          SHR=$(mark "${{ steps.check.outputs.have_sharun }}")

          du_c="${{ steps.check.outputs.deb_ubuntu_count }}"
          du_d="${{ steps.check.outputs.deb_ubuntu_distros }}"
          dd_c="${{ steps.check.outputs.deb_debian_count }}"
          dd_d="${{ steps.check.outputs.deb_debian_distros }}"
          rc="${{ steps.check.outputs.rpm_count }}"
          rd="${{ steps.check.outputs.rpm_distros }}"

          deb_ubuntu_cell="❌ 0"
          if [[ -n "$du_c" && "$du_c" != "0" ]]; then
            deb_ubuntu_cell="✅ $du_c"
            [[ -n "$du_d" ]] && deb_ubuntu_cell="✅ $du_c ($du_d)"
          fi

          deb_debian_cell="❌ 0"
          if [[ -n "$dd_c" && "$dd_c" != "0" ]]; then
            deb_debian_cell="✅ $dd_c"
            [[ -n "$dd_d" ]] && deb_debian_cell="✅ $dd_c ($dd_d)"
          fi

          rpm_cell="❌ 0"
          if [[ -n "$rc" && "$rc" != "0" ]]; then
            rpm_cell="✅ $rc"
            [[ -n "$rd" ]] && rpm_cell="✅ $rc ($rd)"
          fi

          BODY=$(cat <<EOF
          Release v$V (commit ${{ github.sha }})

          | Артефакт | Собрано | Описание |
          |:---|:---:|---|
          | \`*.AppImage\` | $LLD | linuxdeploy — glibc ≥ 2.39, использует системный OpenGL/EGL |
          | \`*-sharun.AppImage\` | $SHR | quick-sharun — свой glibc и рантайм; использует системный OpenGL/EGL |
          | \`.deb\` (Ubuntu) | $deb_ubuntu_cell | Собран на Ubuntu 24.04. Проверен в CI на Ubuntu 26.04. |
          | \`.deb\` (Debian) | $deb_debian_cell | Собран на Debian 13. Проверен в CI на Debian 13. |
          | \`.rpm\` | $rpm_cell | Собран на Rocky 10. Проверен в CI на Rocky 10 и Fedora 44. |

          ### Какой пакет выбрать

          <sub>Собранные пакеты могут теоретически работать и на других системах того же семейства с glibc не ниже версии сборочного контейнера.</sub>

          **Ubuntu 24.04+, Linux Mint 22+** (glibc 2.39) → \`iptvplayer_*_ubuntu-24.04_amd64.deb\`

          **Debian 13+** (glibc 2.41) → \`iptvplayer_*_debian-13_amd64.deb\`

          **RHEL 10+, Rocky 10+, Alma 10+, Fedora 40+** (glibc 2.39) → \`iptvplayer-*.rocky-10.x86_64.rpm\`

          **Любая Linux с системным OpenGL/EGL** (в т.ч. старые glibc, musl-дистрибутивы) → \`*-sharun.AppImage\`
          EOF
          )

          {
            echo "body<<EOF"
            printf '%s\n' "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check.outputs.have_artifacts == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', needs.version.outputs.version) }}
          name: Release v${{ needs.version.outputs.version }}
          body: ${{ steps.body.outputs.body }}
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.zsync
            dist/*.asc
            dist/checksums.txt
            dist/public-key.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup GPG
        if: always()
        uses: ./.github/actions/cleanup-gpg