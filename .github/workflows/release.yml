name: Release from VERSION

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  workflow_dispatch:
    inputs:
      rebuild_deps:
        description: 'Принудительно пересобрать third_party (игнорировать кэш)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: read_version
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then
            echo "VERSION file missing" >&2
            exit 1
          fi
          VERSION=$(head -n1 VERSION | tr -d '\n\r')
          if [[ -z "$VERSION" ]]; then
            echo "VERSION is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Read VERSION=$VERSION"

      - name: Ensure git history and tags present
        run: |
          set -euo pipefail
          git fetch --prune --unshallow || true
          git fetch --tags

      - name: Ensure VERSION changed in this push
        id: check_version_changed
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::Manual dispatch — forcing version_changed=true"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git show --name-only --pretty="" "$AFTER" || true)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          fi
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qx "VERSION"; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare git auth for pushing tags
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git"
          git config user.name "CI Bot"
          git config user.email "ci-bot@example.com"

      - name: Create annotated tag if missing
        if: steps.check_version_changed.outputs.version_changed == 'true'
        id: create_tag
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git fetch --tags
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} exists on origin. Skipping."
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            git push origin "refs/tags/${TAG}"
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git tag -a "${TAG}" -m "Release ${TAG} (CI)"
          git push origin "refs/tags/${TAG}"
          echo "created=true" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      # ---- Кэширование third_party ----
      - name: Cache third_party dependencies
        if: steps.check_version_changed.outputs.version_changed == 'true'
        uses: actions/cache@v4
        with:
          path: third_party
          # runner.arch различает X64 / ARM64 / ARM — без него
          # кэши x86_64 и ARM будут перетирать друг друга.
          key: ${{ runner.os }}-${{ runner.arch }}-third_party-${{ hashFiles('setup-deps.sh') }}

      # ---- Установка системных пакетов и third_party ----
      - name: Install all dependencies
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          chmod +x setup-deps.sh
          if [[ "${{ github.event.inputs.rebuild_deps }}" == "true" ]]; then
            ./setup-deps.sh --yes --rebuild-deps
          else
            ./setup-deps.sh --yes
          fi

      - name: Install packaging tools
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y debsigs rpm gnupg pinentry-curses dpkg-dev
          command -v rpmbuild       || { echo "::error::rpmbuild not found";       exit 1; }
          command -v gpg            || { echo "::error::gpg not found";            exit 1; }
          command -v debsigs        || { echo "::error::debsigs not found";        exit 1; }
          command -v dpkg-shlibdeps || { echo "::error::dpkg-shlibdeps not found"; exit 1; }

      - name: Delete old third_party cache
        if: steps.check_version_changed.outputs.version_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_KEY: ${{ runner.os }}-${{ runner.arch }}-third_party-${{ hashFiles('setup-deps.sh') }}
          KEY_PREFIX: ${{ runner.os }}-${{ runner.arch }}-third_party-
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::gh CLI не найден — пропускаем очистку старых кэшей."
            exit 0
          fi
          # gh cache list: $1=ID, $2=KEY, $3=SIZE, $4=CREATED, $5=LAST ACCESSED
          OLD_KEYS=$(gh cache list --repo "$REPO" --limit 100 \
            | awk -v cur="$CURRENT_KEY" -v prefix="$KEY_PREFIX" \
                  '$2 != cur && index($2, prefix) == 1 {print $2}')
          if [[ -z "$OLD_KEYS" ]]; then
            echo "Нет старых кэшей third_party для удаления."
            exit 0
          fi
          echo "Удаляем старые кэши:"
          echo "$OLD_KEYS"
          set +e
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            gh cache delete "$key" --repo "$REPO" || true
          done <<< "$OLD_KEYS"
          echo "Готово."

      # ---- Импорт GPG-ключа ДО сборки ----
      - name: Import GPG key
        if: steps.check_version_changed.outputs.version_changed == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::No GPG private key found in secrets, skipping signing."
            exit 0
          fi

          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          # ВАЖНО: ключ ДОЛЖЕН быть без пароля — passphrase не поддерживается.
          # Если понадобится — вернуть GPG_PASSPHRASE и добавить
          # --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" на импорт,
          # а также подставить passphrase в wrapper ниже вместо ''.
          echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"
          echo "pinentry-mode loopback" >> "$GNUPGHOME/gpg.conf"

          # Пустой passphrase-файл: ключ без пароля
          : > "$GNUPGHOME/.passphrase"
          chmod 600 "$GNUPGHOME/.passphrase"
          echo "passphrase-file $GNUPGHOME/.passphrase" >> "$GNUPGHOME/gpg.conf"

          gpgconf --kill gpg-agent 2>/dev/null || true
          gpg-connect-agent /bye 2>/dev/null || true

          REAL_GPG="$(command -v gpg)"
          WRAPPER_DIR="$(mktemp -d)"
          cat > "$WRAPPER_DIR/gpg" <<WRAPPER
          #!/bin/bash
          exec "$REAL_GPG" --batch --pinentry-mode loopback --passphrase '' "\$@"
          WRAPPER
          chmod +x "$WRAPPER_DIR/gpg"

          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          if [ -z "$GPG_KEY_ID" ]; then
            echo "::error::GPG key imported but no secret key found."
            exit 1
          fi

          echo "GNUPGHOME=$GNUPGHOME"             >> $GITHUB_ENV
          echo "GPG_KEY_ID=$GPG_KEY_ID"           >> $GITHUB_ENV
          echo "GPG_WRAPPER_DIR=$WRAPPER_DIR"     >> $GITHUB_ENV
          echo "PATH=$WRAPPER_DIR:$PATH"          >> $GITHUB_ENV
          echo "::notice::GPG key imported, ID: $GPG_KEY_ID (GNUPGHOME=$GNUPGHOME, wrapper=$WRAPPER_DIR)"

      # ---- Сборка пакетов ----
      - name: Build packages
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          chmod +x build-package.sh
          ./build-package.sh --all

      # ---- Публичный ключ в dist/ ----
      - name: Export public key
        if: always() && steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          if [ -z "${GPG_KEY_ID:-}" ]; then
            echo "GPG_KEY_ID not set — skipping public key export"
            exit 0
          fi
          mkdir -p dist
          gpg --armor --export "$GPG_KEY_ID" > dist/public-key.asc
          echo "Public key exported to dist/public-key.asc"

      # ---- Очистка приватного ключа ----
      - name: Cleanup GNUPGHOME
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ]; then
            rm -rf "$GNUPGHOME" || true
            echo "GNUPGHOME removed: $GNUPGHOME"
          fi
          rm -f "$HOME/.rpmmacros" || true

      # ---- Публикация релиза ----
      - name: Create GitHub Release and upload artifacts
        if: steps.check_version_changed.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', steps.read_version.outputs.version) }}
          name: Release v${{ steps.read_version.outputs.version }}
          body: "Automated release for version v${{ steps.read_version.outputs.version }} (commit ${{ github.sha }})"
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}