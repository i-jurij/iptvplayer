name: Release from VERSION

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  workflow_dispatch:
    inputs:
      rebuild_deps:
        description: 'Принудительно пересобрать third_party (игнорировать кэш)'
        type: boolean
        default: false
      rebuild_arch_image:
        description: 'Принудительно пересобрать Arch-образ для sharun-AppImage'
        type: boolean
        default: false
      reuse_install_from:
        description: 'Run ID с готовым install/. Пусто = последний успешный, 0 = собрать заново.'
        type: string
        default: ''
      skip_appimage:
        description: 'Не собирать AppImage'
        type: boolean
        default: false
      skip_arch_main:
        description: 'Не собирать основной .pkg (Arch/CachyOS, glibc 2.44)'
        type: boolean
        default: false
      skip_arch_compat:
        description: 'Не собирать compat .pkg (Manjaro/Garuda/UBLinux, glibc 2.42)'
        type: boolean
        default: false
      skip_native:
        description: 'Не собирать .deb/.rpm'
        type: boolean
        default: false
      skip_windows:
        description: 'Не собирать Windows'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  # =========================================================================
  # 1. Версия + тег. Сборкой не занимается.
  # =========================================================================
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read_version.outputs.version }}
      version_changed: ${{ steps.check_version_changed.outputs.version_changed }}
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: read_version
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then echo "VERSION missing" >&2; exit 1; fi
          VERSION=$(head -n1 VERSION | tr -d '\n\r')
          [[ -z "$VERSION" ]] && { echo "VERSION empty" >&2; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Ensure git history and tags
        run: |
          set -euo pipefail
          git fetch --prune --unshallow || true
          git fetch --tags

      - name: Ensure VERSION changed
        id: check_version_changed
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git show --name-only --pretty="" "$AFTER" || true)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          fi
          if echo "$CHANGED" | grep -qx "VERSION"; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare git auth for tags
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git"
          git config user.name "CI Bot"
          git config user.email "ci-bot@example.com"

      - name: Create tag if missing
        if: steps.check_version_changed.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git fetch --tags
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag exists"; exit 0
          fi
          git tag -a "${TAG}" -m "Release ${TAG} (CI)"
          git push origin "refs/tags/${TAG}"

  # =========================================================================
  # 1.5. Определяем, откуда брать install/: свежая сборка или готовый run.
  #    - push-trigger: всегда свежая сборка (VERSION изменился → новый бинарник);
  #    - workflow_dispatch с reuse_install_from="" → последний неистёкший
  #      артефакт arch-install, кроме текущего run;
  #    - workflow_dispatch с reuse_install_from="0" → принудительно свежая;
  #    - workflow_dispatch с reuse_install_from="<N>" → конкретный run N.
  # =========================================================================
  resolve:
    needs: version
    if: needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT: ${{ inputs.reuse_install_from }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            echo "[i] push-trigger — бинарник собирается с нуля"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$INPUT" = "0" ]; then
            echo "[i] reuse_install_from=0 — бинарник собирается с нуля"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$INPUT" ]; then
            echo "[i] reuse_install_from=$INPUT — используем указанный run"
            echo "run_id=$INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Авто-режим. Ищем последний неистёкший артефакт arch-install,
          # исключая текущий run (в нём ещё нет готового install).
          RID=$(gh api \
            "/repos/${{ github.repository }}/actions/artifacts?name=arch-install&per_page=50" \
            --jq '.artifacts[] | select(.expired == false) | "\(.created_at)\t\(.workflow_run.id)"' \
            | sort -r \
            | awk -v cur="$CURRENT_RUN" -F'\t' '$2 != cur {print $2; exit}' || true)

          if [ -n "$RID" ]; then
            echo "[i] авто-режим — используем run $RID"
            echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          else
            echo "[i] авто-режим — подходящих артефактов нет, бинарник собирается с нуля"
            echo "run_id=" >> "$GITHUB_OUTPUT"
          fi

  # =========================================================================
  # 2. Arch-образ для сборки sharun-AppImage.
  #
  # Собирается, только если:
  #   - образ ещё не существует в GHCR (первый прогон);
  #   - upstream-сигналы изменились (updated_at релиза continuous в
  #     pkgforge-dev/archlinux-pkgs-debloated или SHA256 скрипта);
  #   - в workflow_dispatch явно запрошен rebuild_arch_image=true.
  #
  # Состояние хранится в LABEL-ах образа. Если сигналы совпадают,
  # job логирует "up to date" и не пересобирает.
  # =========================================================================
  arch-image:
    needs: version
    if: needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.check.outputs.image_ref }}
      rebuilt: ${{ steps.check.outputs.rebuilt }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if rebuild is needed
        id: check
        env:
          FORCE_REBUILD: ${{ inputs.rebuild_arch_image }}
        run: |
          set -euo pipefail

          IMAGE=$(echo "ghcr.io/${{ github.repository_owner }}/iptvplayer-arch-build" \
                  | tr '[:upper:]' '[:lower:]')
          echo "image_ref=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

          UPSTREAM_UPDATED=$(curl -fsSL \
            "https://api.github.com/repos/pkgforge-dev/archlinux-pkgs-debloated/releases/tags/continuous" \
            | jq -r '.updated_at // "unknown"' || echo "unknown")

          SCRIPT_SHA=$(curl -fsSL \
            "https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/main/useful-tools/get-debloated-pkgs.sh" \
            | sha256sum | awk '{print $1}' || echo "unknown")

          echo "[i] upstream updated_at: $UPSTREAM_UPDATED"
          echo "[i] upstream script sha: $SCRIPT_SHA"

          EXISTING_UPDATED=""
          EXISTING_SHA=""
          if docker pull "$IMAGE:latest" >/dev/null 2>&1; then
            LABELS=$(docker inspect "$IMAGE:latest" \
                     --format '{{json .Config.Labels}}' 2>/dev/null || echo '{}')
            EXISTING_UPDATED=$(echo "$LABELS" | jq -r \
              '."org.iptvplayer.debloated-release-updated" // empty')
            EXISTING_SHA=$(echo "$LABELS" | jq -r \
              '."org.iptvplayer.debloated-script-sha" // empty')
            echo "[i] existing updated_at: ${EXISTING_UPDATED:-<none>}"
            echo "[i] existing script sha: ${EXISTING_SHA:-<none>}"
          else
            echo "[i] образ в GHCR пока не существует"
          fi

          REBUILT="false"
          if [ "${FORCE_REBUILD:-false}" = "true" ]; then
            REBUILT="true"
            echo "[i] принудительная пересборка (workflow_dispatch)"
          elif [ -z "$EXISTING_UPDATED" ] || [ -z "$EXISTING_SHA" ]; then
            REBUILT="true"
            echo "[i] образ отсутствует или LABEL-ы пусты — собираем"
          elif [ "$EXISTING_UPDATED" != "$UPSTREAM_UPDATED" ] \
            || [ "$EXISTING_SHA" != "$SCRIPT_SHA" ]; then
            REBUILT="true"
            echo "[i] upstream изменился — собираем"
          else
            echo "[i] образ актуален, пересборка не требуется"
          fi

          {
            echo "rebuilt=$REBUILT"
            echo "upstream_updated=$UPSTREAM_UPDATED"
            echo "script_sha=$SCRIPT_SHA"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.rebuilt == 'true'

      - name: Build and push image
        if: steps.check.outputs.rebuilt == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          file: .github/docker/iptvplayer-arch-build.Containerfile
          push: true
          tags: ${{ steps.check.outputs.image_ref }}
          build-args: |
            DEBLOATED_RELEASE_UPDATED=${{ steps.check.outputs.upstream_updated }}
            DEBLOATED_SCRIPT_SHA=${{ steps.check.outputs.script_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 3. Сборка бинарника в Arch-образе. Один раз для appimage и arch-pkg.
  #    Пропускается, если resolve нашёл готовый install/ для переиспользования.
  # =========================================================================
  arch-build:
    needs: [version, resolve, arch-image]
    if: |
      needs.version.outputs.version_changed == 'true' &&
      needs.resolve.outputs.run_id == '' &&
      inputs.skip_arch_main != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.arch-image.outputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    env:
      REBUILD_DEPS: ${{ github.event.inputs.rebuild_deps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: third_party
          key: ${{ runner.os }}-${{ runner.arch }}-arch-appimage-third_party-${{ hashFiles('scripts/setup-deps.sh', 'scripts/setup-deps-*.sh') }}

      - name: Build third_party (wxWidgets, wxSQLite3)
        run: |
          set -euo pipefail
          chmod +x scripts/setup-deps.sh
          if [[ "${REBUILD_DEPS:-}" == "true" ]]; then
            ./scripts/setup-deps.sh --yes --skip-system --rebuild-deps
          else
            ./scripts/setup-deps.sh --yes --skip-system
          fi

      - name: Build binary
        run: |
          set -euo pipefail
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh --type release --prefix "$PWD/install" --yes

      - name: Upload install tree
        uses: actions/upload-artifact@v5
        with:
          name: arch-install
          path: install/
          retention-days: 3
          if-no-files-found: error

  # =========================================================================
  # 4. AppImage (quick-sharun) на подготовленном Arch-образе.
  # =========================================================================
  appimage:
    needs: [version, resolve, arch-image, arch-build]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.version.outputs.version_changed == 'true' &&
      inputs.skip_appimage != true &&
      inputs.skip_arch_main != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: read
    container:
      image: ${{ needs.arch-image.outputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download install tree (reuse from previous run)
        if: needs.resolve.outputs.run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: arch-install
          path: install
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download install tree (fresh)
        if: needs.resolve.outputs.run_id == ''
        uses: actions/download-artifact@v5
        with:
          name: arch-install
          path: install

      - name: Restore executable bit
        run: |
          set -euo pipefail
          chmod +x install/bin/iptvplayer
          ls -la install/bin/

      - name: Build AppImage (sharun)
        run: |
          set -euo pipefail

          mkdir -p logs
          chmod +x scripts/build-package.sh

          ./scripts/build-package.sh --sharun --yes 2>&1 \
            | tee logs/build-package.log

          shopt -s nullglob
          imgs=(dist/*-sharun.AppImage)

          if (( ${#imgs[@]} == 0 )); then
            echo "::error::sharun AppImage не найден в dist/"
            exit 1
          fi

          printf 'собрано AppImage: %d\n' "${#imgs[@]}"
          printf '  %s\n' "${imgs[@]}"

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: packages
          path: dist/
          retention-days: 3
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: appimage-build-log
          path: logs/build-package.log
          retention-days: 3
          if-no-files-found: ignore

  # =========================================================================
  # 5. Нативный пакет для Arch (.pkg.tar.zst)
  #
  # Берёт готовый install/ из arch-build или из предыдущего run'а,
  # формирует PKGBUILD с автоматически определёнными зависимостями
  # (ldd + pacman -Fq) и собирает пакет через makepkg от непривилегированного
  # пользователя.
  # =========================================================================
  arch-pkg:
    needs: [version, resolve, arch-image, arch-build]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.version.outputs.version_changed == 'true' &&
      inputs.skip_arch_main != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: read
    container:
      image: ${{ needs.arch-image.outputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v5

      - name: Download install tree (reuse from previous run)
        if: needs.resolve.outputs.run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: arch-install
          path: install
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download install tree (fresh)
        if: needs.resolve.outputs.run_id == ''
        uses: actions/download-artifact@v5
        with:
          name: arch-install
          path: install

      - name: Build Arch package
        run: |
          set -euo pipefail
          # actions/upload-artifact не сохраняет exec-бит, всё выгружается
          # как 644. Возвращаем +x бинарнику до вызова скрипта.
          chmod +x install/bin/iptvplayer
          ls -la install/bin/

          chmod +x scripts/*.sh

          # Вся логика — в build-native-arch.sh:build_pkg_arch.
          ./scripts/build-package.sh --native-arch --yes
          ls -la dist/

      - name: Import GPG key
        id: gpg
        uses: ./.github/actions/import-gpg
        with:
          private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase:  ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign Arch package
        if: steps.gpg.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in "$GITHUB_WORKSPACE"/dist/*.pkg.tar.zst; do
            gpg --yes --detach-sign --armor -u "$GPG_KEY_ID" -o "$f.asc" "$f"
          done

      - name: Upload Arch package
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-arch
          path: |
            dist/*.pkg.tar.zst
            dist/*.pkg.tar.zst.asc
          retention-days: 3
          if-no-files-found: error

      - name: Cleanup GPG
        if: always()
        uses: ./.github/actions/cleanup-gpg

  # =========================================================================
  # 5.1. Совместимый .pkg.tar.zst из замороженного среза Arch 2025-10-05
  # (glibc 2.42). Сборка и упаковка — в одном контейнере: один
  # pacman-key --init, одна установка toolchain, один pacman -Syu.
  # Даёт пакет для Manjaro/Garuda/UBLinux. Основной arch-pkg не трогается.
  # =========================================================================
  arch-compat:
    needs: [version]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.version.outputs.version_changed == 'true' &&
      inputs.skip_arch_compat != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      # Образ Arch от 2025-10-05: glibc 2.42 (28.07.2025), до 2.43 (~нач. 2026).
      image: archlinux:base-20251005.0.430597
      options: --user root
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Freeze repos to snapshot date
        run: |
          set -euo pipefail
          # Без mirrorlist на ALA pacman -Syu утянет текущий Arch (glibc 2.44).
          echo 'Server=https://archive.archlinux.org/repos/2025/10/05/$repo/os/$arch' \
            > /etc/pacman.d/mirrorlist

      - name: Init and refresh pacman keyring
        run: |
          set -euo pipefail
          # Мастер-ключи в снапшоте 2025-10-05 подписаны SHA1. GnuPG >= 2.4
          # по умолчанию такие подписи отклоняет, из-за чего цепочка доверия
          # до пакетов (flex/make/sudo) не выстраивается — "unknown trust".
          # Разрешаем weak-подписи ТОЛЬКО для pacman-key в этом контейнере.
          mkdir -p /etc/pacman.d/gnupg
          echo 'allow-weak-key-signatures' > /etc/pacman.d/gnupg/gpg.conf

          pacman-key --init
          pacman-key --populate archlinux
          # Свежий archlinux-keyring из снапшота: иначе пакеты из 2025-10-05
          # подписаны ключами, которых нет в базовом образе.
          pacman -Sy --noconfirm archlinux-keyring
          pacman-key --updatedb 2>/dev/null || true

      - name: Install build toolchain
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed
          pacman -S --noconfirm --needed \
            base-devel cmake git patchelf wget curl

      - name: Verify glibc baseline
        run: |
          set -euo pipefail
          GLIBC=$(/usr/lib/ld-linux-x86-64.so.2 --version | head -1)
          echo "[i] glibc: $GLIBC"
          echo "$GLIBC" | grep -q "2\.42" \
            || { echo "::error::glibc is not 2.42 — wrong snapshot"; exit 1; }

      - uses: actions/cache@v5
        with:
          path: third_party
          key: ${{ runner.os }}-${{ runner.arch }}-arch-compat-third_party-${{ hashFiles('scripts/setup-deps.sh', 'scripts/setup-deps-*.sh') }}

      - name: Build third_party
        run: |
          set -euo pipefail
          chmod +x scripts/setup-deps.sh
          ./scripts/setup-deps.sh --yes --skip-system

      - name: Build binary
        run: |
          set -euo pipefail
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh --type release --prefix "$PWD/install" --yes

      - name: Verify binary glibc requirement
        run: |
          set -euo pipefail
          REQ=$(readelf -V install/bin/iptvplayer 2>/dev/null \
                | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "[i] binary max GLIBC: $REQ (baseline 2.42)"
          HIGHER=$(printf '%s\n%s\n' "2.42" "$REQ" | sort -V | tail -1)
          [ "$HIGHER" = "2.42" ] \
            || { echo "::error::binary requires GLIBC_$REQ > 2.42"; exit 1; }

      - name: Build Arch compat package
        run: |
          set -euo pipefail
          chmod +x install/bin/iptvplayer scripts/*.sh
          ls -la install/bin/
          ./scripts/build-package.sh --native-arch --yes
          # Суффикс -compat до расширения, чтобы отличать от основного.
          shopt -s nullglob
          for f in dist/*.pkg.tar.zst; do
            mv "$f" "${f%.pkg.tar.zst}-compat.pkg.tar.zst"
          done
          ls -la dist/

      - name: Import GPG key
        id: gpg
        uses: ./.github/actions/import-gpg
        with:
          private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase:  ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign compat Arch package
        if: steps.gpg.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in dist/*-compat.pkg.tar.zst; do
            gpg --yes --detach-sign --armor -u "$GPG_KEY_ID" -o "$f.asc" "$f"
          done

      - name: Upload compat Arch package
        uses: actions/upload-artifact@v5
        with:
          name: native-arch-compat
          path: |
            dist/*-compat.pkg.tar.zst
            dist/*-compat.pkg.tar.zst.asc
          retention-days: 3
          if-no-files-found: error

      - name: Cleanup GPG
        if: always()
        uses: ./.github/actions/cleanup-gpg

  # =========================================================================
  # 6. Нативные .deb / .rpm — каждый в своём контейнере
  # =========================================================================
  native-packages:
    needs: [version, resolve]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.version.outputs.version_changed == 'true' &&
      inputs.skip_native != true
    uses: ./.github/workflows/native-packages.yml
    with:
      targets: '["ubuntu-24.04","debian-13","rocky-10"]'
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}

  # =========================================================================
  # 6.5. Windows-пакет (zip + NSIS setup.exe).
  #
  # Reusable workflow собирает на windows-latest в MSYS2 UCRT64.
  # Публикация в релиз — не здесь, а в джобе release (как Linux).
  # =========================================================================
  windows-build:
    needs: [version, resolve]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.version.outputs.version_changed == 'true'&&
      inputs.skip_windows != true
    uses: ./.github/workflows/windows-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag: v${{ needs.version.outputs.version }}
      upload_to_release: false

  # =========================================================================
  # 7. Публикация: подпись + checksums + релиз
  #
  # При частичной пересборке (skip_*) к уже существующему релизу
  # подкладываются новые ассеты поверх старых. Старые ассеты, которых
  # нет в этом run'е, сохраняются — action-gh-release их не удаляет.
  # =========================================================================
  release:
    needs: [version, resolve, appimage, arch-pkg, arch-compat, native-packages, windows-build]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Скачиваем уже опубликованные ассеты — чтобы при частичной
      # пересборке (skip_appimage/skip_arch_pkg/skip_native) в итоговом
      # checksums.txt были хеши ВСЕХ файлов релиза, а не только свежих.
      # Ошибки глушим — на первом релизе этого шага просто нет.
      - name: Download existing release assets
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p dist
          TAG="v${{ needs.version.outputs.version }}"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --clobber \
            --pattern '*-sharun.AppImage' \
            --pattern '*-sharun.AppImage.zsync' \
            --pattern '*.pkg.tar.zst' \
            --pattern '*.pkg.tar.zst.asc' \
            --pattern '*-compat.pkg.tar.zst' \
            --pattern '*-compat.pkg.tar.zst.asc' \
            --pattern '*.deb' \
            --pattern '*.deb.asc' \
            --pattern '*.rpm' \
            --pattern '*.rpm.asc' \
            --pattern '*-win64.zip' \
            --pattern '*-win64-setup.exe' \
            || true
          ls -la dist/ || true

      # Свежие ассеты из текущего run'а перезаписывают существующие.
      - name: Download AppImage (current run)
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: packages
          path: dist

      - name: Download all native packages (current run)
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Download Windows packages (current run)
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: windows-packages
          path: dist

      - name: Import GPG key
        id: gpg
        uses: ./.github/actions/import-gpg
        with:
          private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase:  ${{ secrets.GPG_PASSPHRASE }}

      - name: Export public key
        if: steps.gpg.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          gpg --armor --export "$GPG_KEY_ID" > dist/public-key.asc

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=()
          for f in *; do
            case "$f" in
              checksums.txt|checksums.txt.asc|public-key.asc) continue ;;
            esac
            [ -f "$f" ] || continue
            files+=("$f")
          done
          (( ${#files[@]} > 0 )) && sha256sum "${files[@]}" > checksums.txt || :
          cd -

      - name: Sign checksums
        if: steps.gpg.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          gpg --yes --detach-sign --armor -u "$GPG_KEY_ID" \
            -o dist/checksums.txt.asc dist/checksums.txt || true

      - name: Check artifacts
        id: check
        run: |
          set -euo pipefail
          echo "=== dist/ ==="
          ls -la dist/ 2>/dev/null || true
          echo ""

          shopt -s nullglob

          sharun=(dist/*-sharun.AppImage)
          deb=(dist/*.deb)
          rpm=(dist/*.rpm)
          arch_pkg=(dist/*.pkg.tar.zst)
          arch_pkg_compat=(dist/*-compat.pkg.tar.zst)
          # >>> Windows
          win_zip=(dist/*-win64.zip)
          win_setup=(dist/*-win64-setup.exe)
          # <<< Windows

          deb_ubuntu_count=0
          deb_ubuntu_distros=""
          deb_debian_count=0
          deb_debian_distros=""
          for f in "${deb[@]}"; do
            b=$(basename "$f" .deb)
            d="${b%_*}"; d="${d##*_}"
            case "$d" in
              ubuntu-*)
                deb_ubuntu_count=$((deb_ubuntu_count + 1))
                deb_ubuntu_distros+="${d}, " ;;
              debian-*)
                deb_debian_count=$((deb_debian_count + 1))
                deb_debian_distros+="${d}, " ;;
            esac
          done
          deb_ubuntu_distros="${deb_ubuntu_distros%, }"
          deb_debian_distros="${deb_debian_distros%, }"

          rpm_distros=""
          for f in "${rpm[@]}"; do
            b=$(basename "$f" .rpm)
            d="${b%.*}"; d="${d##*.}"
            rpm_distros+="${d}, "
          done
          rpm_distros="${rpm_distros%, }"

          echo "Arch package:          ${#arch_pkg[@]}"
          echo "Arch compat package:   ${#arch_pkg_compat[@]}"
          echo "AppImage(sharun):      ${#sharun[@]}"
          echo ".deb (Ubuntu):         ${deb_ubuntu_count}  [${deb_ubuntu_distros}]"
          echo ".deb (Debian):         ${deb_debian_count}  [${deb_debian_distros}]"
          echo ".rpm:                  ${#rpm[@]}  [${rpm_distros}]"
          # >>> Windows
          echo "Windows .zip:          ${#win_zip[@]}"
          echo "Windows setup.exe:     ${#win_setup[@]}"
          # <<< Windows

          have_shr=false; (( ${#sharun[@]} > 0 )) && have_shr=true

          {
            echo "have_sharun=$have_shr"
            echo "arch_count=${#arch_pkg[@]}"
            echo "arch_compat_count=${#arch_pkg_compat[@]}"
            echo "deb_ubuntu_count=$deb_ubuntu_count"
            echo "deb_ubuntu_distros=$deb_ubuntu_distros"
            echo "deb_debian_count=$deb_debian_count"
            echo "deb_debian_distros=$deb_debian_distros"
            echo "rpm_count=${#rpm[@]}"
            echo "rpm_distros=$rpm_distros"
            # >>> Windows
            echo "win_zip_count=${#win_zip[@]}"
            echo "win_setup_count=${#win_setup[@]}"
            # <<< Windows
          } >> $GITHUB_OUTPUT

          # >>> Windows в total
          total=$(( ${#sharun[@]} + ${#deb[@]} + ${#rpm[@]} + ${#arch_pkg[@]} \
                   + ${#win_zip[@]} + ${#win_setup[@]} ))
          # <<< Windows
          if (( total > 0 )); then
            echo "have_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "have_artifacts=false" >> $GITHUB_OUTPUT
            echo "::error::не собралось ни одного артефакта — релиз не создаётся"
          fi

      - name: Compose release body
        id: body
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"

          mark() { [[ "$1" == "true" ]] && printf '✅' || printf '❌'; }
          SHR=$(mark "${{ steps.check.outputs.have_sharun }}")

          wz="${{ steps.check.outputs.win_zip_count }}"
          ws="${{ steps.check.outputs.win_setup_count }}"
          du="${{ steps.check.outputs.deb_ubuntu_count }}"
          dd="${{ steps.check.outputs.deb_debian_count }}"
          rc="${{ steps.check.outputs.rpm_count }}"
          ac="${{ steps.check.outputs.arch_count }}"
          acc="${{ steps.check.outputs.arch_compat_count }}"

          win_zip_cell=$([[ -n "$wz" && "$wz" != "0" ]] && printf '✅' || printf '❌')
          win_setup_cell=$([[ -n "$ws" && "$ws" != "0" ]] && printf '✅' || printf '❌')
          deb_ubuntu_cell=$([[ -n "$du" && "$du" != "0" ]] && printf '✅' || printf '❌')
          deb_debian_cell=$([[ -n "$dd" && "$dd" != "0" ]] && printf '✅' || printf '❌')
          rpm_cell=$([[ -n "$rc" && "$rc" != "0" ]] && printf '✅' || printf '❌')
          arch_cell=$([[ -n "$ac" && "$ac" != "0" ]] && printf '✅' || printf '❌')
          arch_compat_cell=$([[ -n "$acc" && "$acc" != "0" ]] && printf '✅' || printf '❌')

          BODY=$(cat <<EOF
          Release v$V (commit ${{ github.sha }})

          | Артефакт | Собрано | Описание |
          |:---|:---:|---|
          | \`*-sharun.AppImage\` | $SHR | Работает практически во всех Linux (Void, NixOS, Tinycore и т.д.) |
          | \`*-arch-*.pkg.tar.zst\` | $arch_cell | Arch Linux, CachyOS, EndeavourOS (glibc ≥ 2.44). Установка: \`sudo pacman -U iptvplayer-*.pkg.tar.zst\` |
          | \`*-arch-*-compat.pkg.tar.zst\` | $arch_compat_cell | Manjaro, Garuda, UBLinux (glibc 2.42+). Установка: \`sudo pacman -U iptvplayer-*-compat.pkg.tar.zst\` |
          | \`*-ubuntu-*.deb\` | $deb_ubuntu_cell | Ubuntu 24.04+. Установка: \`sudo apt install iptvplayer-*-ubuntu-*.deb\` |
          | \`*-debian-*.deb\` | $deb_debian_cell | Debian 13+. Установка: \`sudo apt install iptvplayer-*-debian-*.deb\` |
          | \`*-rocky-*.rpm\` | $rpm_cell | Rocky 10+, Fedora 44+, Alt p11, Роса 13, OpenSuse Leap 16, OpenMandriva 6.0, Mageia 10. Установка: \`sudo (dnf \\| epm \\| zypper) install iptvplayer-*-rocky-*.rpm\` |
          | \`*-win64.zip\` | $win_zip_cell | **Test only!** Windows 10+. Portable: распаковать и запустить \`iptvplayer.exe\`. |
          | \`*-win64-setup.exe\` | $win_setup_cell | **Test only!** Windows 10+. NSIS-инсталлятор. |

          <sub>Собранные пакеты могут теоретически работать и на других системах того же семейства с glibc не ниже версии сборочного контейнера.</sub>
          EOF
          )

          {
            echo "body<<EOF"
            printf '%s\n' "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check.outputs.have_artifacts == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', needs.version.outputs.version) }}
          name: Release v${{ needs.version.outputs.version }}
          body: ${{ steps.body.outputs.body }}
          files: |
            dist/*-sharun.AppImage
            dist/*-sharun.AppImage.zsync
            dist/*.pkg.tar.zst
            dist/*.deb
            dist/*.rpm
            dist/*.asc
            dist/*-win64.zip
            dist/*-win64-setup.exe
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup GPG
        if: always()
        uses: ./.github/actions/cleanup-gpg