name: Release from VERSION

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  workflow_dispatch:
    inputs:
      rebuild_deps:
        description: 'Принудительно пересобрать third_party (игнорировать кэш)'
        type: boolean
        default: false
      rebuild_arch_image:
        description: 'Принудительно пересобрать Arch-образ для sharun-AppImage'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  # =========================================================================
  # 1. Версия + тег. Сборкой не занимается.
  # =========================================================================
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read_version.outputs.version }}
      version_changed: ${{ steps.check_version_changed.outputs.version_changed }}
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: read_version
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then echo "VERSION missing" >&2; exit 1; fi
          VERSION=$(head -n1 VERSION | tr -d '\n\r')
          [[ -z "$VERSION" ]] && { echo "VERSION empty" >&2; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Ensure git history and tags
        run: |
          set -euo pipefail
          git fetch --prune --unshallow || true
          git fetch --tags

      - name: Ensure VERSION changed
        id: check_version_changed
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git show --name-only --pretty="" "$AFTER" || true)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          fi
          if echo "$CHANGED" | grep -qx "VERSION"; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare git auth for tags
        if: steps.check_version_changed.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git"
          git config user.name "CI Bot"
          git config user.email "ci-bot@example.com"

      - name: Create tag if missing
        if: steps.check_version_changed.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git fetch --tags
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag exists"; exit 0
          fi
          git tag -a "${TAG}" -m "Release ${TAG} (CI)"
          git push origin "refs/tags/${TAG}"

  # =========================================================================
  # 2. Arch-образ для сборки sharun-AppImage.
  #
  # Собирается, только если:
  #   - образ ещё не существует в GHCR (первый прогон);
  #   - upstream-сигналы изменились (updated_at релиза continuous в
  #     pkgforge-dev/archlinux-pkgs-debloated или SHA256 скрипта);
  #   - в workflow_dispatch явно запрошен rebuild_arch_image=true.
  #
  # Состояние хранится в LABEL-ах образа. Если сигналы совпадают,
  # job логирует "up to date" и не пересобирает.
  # =========================================================================
  arch-image:
    needs: version
    if: needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.check.outputs.image_ref }}
      rebuilt: ${{ steps.check.outputs.rebuilt }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if rebuild is needed
        id: check
        env:
          FORCE_REBUILD: ${{ inputs.rebuild_arch_image }}
        run: |
          set -euo pipefail

          IMAGE=$(echo "ghcr.io/${{ github.repository_owner }}/iptvplayer-arch-build" \
                  | tr '[:upper:]' '[:lower:]')
          echo "image_ref=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

          UPSTREAM_UPDATED=$(curl -fsSL \
            "https://api.github.com/repos/pkgforge-dev/archlinux-pkgs-debloated/releases/tags/continuous" \
            | jq -r '.updated_at // "unknown"' || echo "unknown")

          SCRIPT_SHA=$(curl -fsSL \
            "https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/main/useful-tools/get-debloated-pkgs.sh" \
            | sha256sum | awk '{print $1}' || echo "unknown")

          echo "[i] upstream updated_at: $UPSTREAM_UPDATED"
          echo "[i] upstream script sha: $SCRIPT_SHA"

          EXISTING_UPDATED=""
          EXISTING_SHA=""
          if docker pull "$IMAGE:latest" >/dev/null 2>&1; then
            LABELS=$(docker inspect "$IMAGE:latest" \
                     --format '{{json .Config.Labels}}' 2>/dev/null || echo '{}')
            EXISTING_UPDATED=$(echo "$LABELS" | jq -r \
              '."org.iptvplayer.debloated-release-updated" // empty')
            EXISTING_SHA=$(echo "$LABELS" | jq -r \
              '."org.iptvplayer.debloated-script-sha" // empty')
            echo "[i] existing updated_at: ${EXISTING_UPDATED:-<none>}"
            echo "[i] existing script sha: ${EXISTING_SHA:-<none>}"
          else
            echo "[i] образ в GHCR пока не существует"
          fi

          REBUILT="false"
          if [ "${FORCE_REBUILD:-false}" = "true" ]; then
            REBUILT="true"
            echo "[i] принудительная пересборка (workflow_dispatch)"
          elif [ -z "$EXISTING_UPDATED" ] || [ -z "$EXISTING_SHA" ]; then
            REBUILT="true"
            echo "[i] образ отсутствует или LABEL-ы пусты — собираем"
          elif [ "$EXISTING_UPDATED" != "$UPSTREAM_UPDATED" ] \
            || [ "$EXISTING_SHA" != "$SCRIPT_SHA" ]; then
            REBUILT="true"
            echo "[i] upstream изменился — собираем"
          else
            echo "[i] образ актуален, пересборка не требуется"
          fi

          {
            echo "rebuilt=$REBUILT"
            echo "upstream_updated=$UPSTREAM_UPDATED"
            echo "script_sha=$SCRIPT_SHA"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.rebuilt == 'true'

      - name: Build and push image
        if: steps.check.outputs.rebuilt == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          file: .github/docker/iptvplayer-arch-build.Containerfile
          push: true
          tags: ${{ steps.check.outputs.image_ref }}
          build-args: |
            DEBLOATED_RELEASE_UPDATED=${{ steps.check.outputs.upstream_updated }}
            DEBLOATED_SCRIPT_SHA=${{ steps.check.outputs.script_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 3. Сборка бинарника в Arch-образе. Один раз для appimage и arch-pkg.
  # =========================================================================
  arch-build:
    needs: [version, arch-image]
    if: needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.arch-image.outputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    env:
      REBUILD_DEPS: ${{ github.event.inputs.rebuild_deps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: third_party
          key: ${{ runner.os }}-${{ runner.arch }}-arch-appimage-third_party-${{ hashFiles('scripts/setup-deps.sh') }}

      - name: Build third_party (wxWidgets, wxSQLite3)
        run: |
          set -euo pipefail
          chmod +x scripts/setup-deps.sh
          if [[ "${REBUILD_DEPS:-}" == "true" ]]; then
            ./scripts/setup-deps.sh --yes --skip-system --rebuild-deps
          else
            ./scripts/setup-deps.sh --yes --skip-system
          fi

      - name: Build binary
        run: |
          set -euo pipefail
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh --type release --prefix "$PWD/install" --yes

      - name: Upload install tree
        uses: actions/upload-artifact@v5
        with:
          name: arch-install
          path: install/
          retention-days: 3
          if-no-files-found: error

  # =========================================================================
  # 4. AppImage (quick-sharun) на подготовленном Arch-образе.
  # =========================================================================
  appimage:
    needs: [version, arch-image, arch-build]
    if: needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.arch-image.outputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download install tree
        uses: actions/download-artifact@v5
        with:
          name: arch-install
          path: install

      - name: Restore executable bit
        run: |
          set -euo pipefail
          chmod +x install/bin/iptvplayer
          ls -la install/bin/

      - name: Build AppImage (sharun)
        run: |
          set -euo pipefail

          mkdir -p logs
          chmod +x scripts/build-package.sh

          ./scripts/build-package.sh --sharun --yes 2>&1 \
            | tee logs/build-package.log

          shopt -s nullglob
          imgs=(dist/*-sharun.AppImage)

          if (( ${#imgs[@]} == 0 )); then
            echo "::error::sharun AppImage не найден в dist/"
            exit 1
          fi

          printf 'собрано AppImage: %d\n' "${#imgs[@]}"
          printf '  %s\n' "${imgs[@]}"

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: packages
          path: dist/
          retention-days: 3
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: appimage-build-log
          path: logs/build-package.log
          retention-days: 3
          if-no-files-found: ignore

  # =========================================================================
  # 5. Нативный пакет для Arch (.pkg.tar.zst)
  #
  # Берёт готовый install/ из arch-build, формирует PKGBUILD с автоматически
  # определёнными зависимостями (ldd + pacman -Fq) и собирает пакет через
  # makepkg от непривилегированного пользователя.
  # =========================================================================
  arch-pkg:
    needs: [version, arch-image, arch-build]
    if: needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.arch-image.outputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v5

      - name: Download install tree
        uses: actions/download-artifact@v5
        with:
          name: arch-install
          path: install

      - name: Restore executable bit
        run: |
          set -euo pipefail
          # actions/upload-artifact не сохраняет режим файлов —
          # всё выгружается как 644. Возвращаем +x бинарнику.
          chmod +x install/bin/iptvplayer
          ls -la install/bin/

      - name: Detect runtime dependencies
        id: detect
        run: |
          set -euo pipefail

          pacman -Fy >/dev/null 2>&1 || true

          BIN="install/bin/iptvplayer"
          [ -x "$BIN" ] || { echo "::error::$BIN не найден или не исполняем"; exit 1; }

          ldd "$BIN" 2>/dev/null \
            | awk '
                /=>/ && $3 ~ /^\//  { print $3 }
                /^\t\//              { print $1 }
              ' \
            | sort -u > /tmp/iptv-libs.txt

          echo "=== resolved libraries ==="
          cat /tmp/iptv-libs.txt

          : > /tmp/iptv-pkgs.txt
          while IFS= read -r lib; do
            [ -z "$lib" ] && continue
            pacman -Fq "$lib" 2>/dev/null \
              | awk -F/ '{print $2}' >> /tmp/iptv-pkgs.txt || true
          done < /tmp/iptv-libs.txt

          DEPS=$(sort -u /tmp/iptv-pkgs.txt \
                 | grep -vxE 'glibc|gcc-libs' \
                 | grep -v '^$' \
                 | tr '\n' ' ')

          # Ручные runtime-зависимости, которые ldd не видит (dlopen).
          #   mesa          — OpenGL/Vulkan ICD
          #   gdk-pixbuf2   — pixbuf-лоадеры для иконок
          #   librsvg       — SVG-лоадер для gdk-pixbuf
          # HW-декодирование (libva-mesa-driver и т. п.) — на усмотрение
          # пользователя, в depends не включаем.
          EXTRA_DEPS="mesa gdk-pixbuf2 librsvg"

          ALL_DEPS="$DEPS $EXTRA_DEPS"
          echo "[i] auto-detected: $DEPS"
          echo "[i] extras:       $EXTRA_DEPS"
          echo "[i] final:        $ALL_DEPS"
          echo "deps=$ALL_DEPS" >> "$GITHUB_OUTPUT"

      - name: Create PKGBUILD
        env:
          DEPS: ${{ steps.detect.outputs.deps }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\n\r' < install/VERSION)

          deps_array=""
          for d in $DEPS; do
            deps_array+="'$d' "
          done

          mkdir -p /tmp/archpkg
          cat > /tmp/archpkg/PKGBUILD <<EOF
          # Maintainer: i-jurij <mnisjil@duck.com>
          pkgname=iptvplayer
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="IPTV playlist player (wxWidgets + libmpv)"
          arch=('x86_64')
          url="https://github.com/i-jurij/iptvplayer"
          license=('MIT')
          depends=(${deps_array})
          source=()

          package() {
            cd "\$startdir/install"
            # Копируем только bin/ и share/, чтобы VERSION* не попали в /.
            install -d "\$pkgdir/usr/bin" "\$pkgdir/usr/share"
            cp -a bin/iptvplayer "\$pkgdir/usr/bin/"
            cp -a share/. "\$pkgdir/usr/share/"
          }
          EOF

          echo "=== PKGBUILD ==="
          cat /tmp/archpkg/PKGBUILD

      - name: Build .pkg.tar.zst
        run: |
          set -euo pipefail

          # makepkg не работает от root. Создаём пользователя и отдаём
          # ему изолированную директорию /tmp/archpkg. Репозиторий с
          # third_party не трогаем — chown по нему занимает секунды.
          useradd -m builder 2>/dev/null || true
          cp -a install /tmp/archpkg/install
          chown -R builder:builder /tmp/archpkg

          cd /tmp/archpkg
          # --nodeps: проверку зависимостей пропускаем, пакет несёт их
          #           только как метаданные для конечного пользователя.
          runuser -u builder -- /usr/bin/makepkg --nodeps --noconfirm

          shopt -s nullglob
          pkgs=(/tmp/archpkg/*.pkg.tar.zst)
          (( ${#pkgs[@]} > 0 )) || { echo "::error::makepkg не создал .pkg.tar.zst"; exit 1; }

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "${pkgs[@]}" "$GITHUB_WORKSPACE/dist/"
          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Import GPG key
        id: gpg
        uses: ./.github/actions/import-gpg
        with:
          private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase:  ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign Arch package
        if: steps.gpg.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in "$GITHUB_WORKSPACE"/dist/*.pkg.tar.zst; do
            gpg --yes --detach-sign --armor -u "$GPG_KEY_ID" -o "$f.asc" "$f"
          done

      - name: Upload Arch package
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-arch
          path: |
            dist/*.pkg.tar.zst
            dist/*.pkg.tar.zst.asc
          retention-days: 3
          if-no-files-found: error

      - name: Cleanup GPG
        if: always()
        uses: ./.github/actions/cleanup-gpg

  # =========================================================================
  # 6. Нативные .deb / .rpm — каждый в своём контейнере
  # =========================================================================
  native-packages:
    needs: version
    if: needs.version.outputs.version_changed == 'true'
    uses: ./.github/workflows/native-packages.yml
    with:
      targets: '["ubuntu-24.04","debian-13","rocky-10"]'
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}

  # =========================================================================
  # 7. Публикация: подпись + checksums + релиз
  # =========================================================================
  release:
    needs: [version, appimage, arch-pkg, native-packages]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download AppImage
        continue-on-error: true
        uses: actions/download-artifact@v5
        with: { name: packages, path: dist }

      - name: Download all native packages
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Import GPG key
        id: gpg
        uses: ./.github/actions/import-gpg
        with:
          private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase:  ${{ secrets.GPG_PASSPHRASE }}

      - name: Export public key
        if: steps.gpg.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          gpg --armor --export "$GPG_KEY_ID" > dist/public-key.asc

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=()
          for f in *; do
            case "$f" in
              checksums.txt|checksums.txt.asc|public-key.asc) continue ;;
            esac
            [ -f "$f" ] || continue
            files+=("$f")
          done
          (( ${#files[@]} > 0 )) && sha256sum "${files[@]}" > checksums.txt || :
          cd -

      - name: Sign checksums
        if: steps.gpg.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          gpg --yes --detach-sign --armor -u "$GPG_KEY_ID" \
            -o dist/checksums.txt.asc dist/checksums.txt || true

      - name: Check artifacts
        id: check
        run: |
          set -euo pipefail
          echo "=== dist/ ==="
          ls -la dist/ 2>/dev/null || true
          echo ""

          shopt -s nullglob

          sharun=(dist/*-sharun.AppImage)
          deb=(dist/*.deb)
          rpm=(dist/*.rpm)
          arch_pkg=(dist/*.pkg.tar.zst)

          deb_ubuntu_count=0
          deb_ubuntu_distros=""
          deb_debian_count=0
          deb_debian_distros=""
          for f in "${deb[@]}"; do
            b=$(basename "$f" .deb)
            d="${b%_*}"; d="${d##*_}"
            case "$d" in
              ubuntu-*)
                deb_ubuntu_count=$((deb_ubuntu_count + 1))
                deb_ubuntu_distros+="${d}, " ;;
              debian-*)
                deb_debian_count=$((deb_debian_count + 1))
                deb_debian_distros+="${d}, " ;;
            esac
          done
          deb_ubuntu_distros="${deb_ubuntu_distros%, }"
          deb_debian_distros="${deb_debian_distros%, }"

          rpm_distros=""
          for f in "${rpm[@]}"; do
            b=$(basename "$f" .rpm)
            d="${b%.*}"; d="${d##*.}"
            rpm_distros+="${d}, "
          done
          rpm_distros="${rpm_distros%, }"

          echo "Arch package:          ${#arch_pkg[@]}"
          echo "AppImage(sharun):      ${#sharun[@]}"
          echo ".deb (Ubuntu):         ${deb_ubuntu_count}  [${deb_ubuntu_distros}]"
          echo ".deb (Debian):         ${deb_debian_count}  [${deb_debian_distros}]"
          echo ".rpm:                  ${#rpm[@]}  [${rpm_distros}]"

          have_shr=false; (( ${#sharun[@]} > 0 )) && have_shr=true

          {
            echo "have_sharun=$have_shr"
            echo "arch_count=${#arch_pkg[@]}"
            echo "deb_ubuntu_count=$deb_ubuntu_count"
            echo "deb_ubuntu_distros=$deb_ubuntu_distros"
            echo "deb_debian_count=$deb_debian_count"
            echo "deb_debian_distros=$deb_debian_distros"
            echo "rpm_count=${#rpm[@]}"
            echo "rpm_distros=$rpm_distros"
          } >> $GITHUB_OUTPUT

          total=$(( ${#sharun[@]} + ${#deb[@]} + ${#rpm[@]} + ${#arch_pkg[@]} ))
          if (( total > 0 )); then
            echo "have_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "have_artifacts=false" >> $GITHUB_OUTPUT
            echo "::error::не собралось ни одного артефакта — релиз не создаётся"
          fi

      - name: Compose release body
        id: body
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"

          mark() { [[ "$1" == "true" ]] && printf '✅' || printf '❌'; }
          SHR=$(mark "${{ steps.check.outputs.have_sharun }}")

          du_c="${{ steps.check.outputs.deb_ubuntu_count }}"
          du_d="${{ steps.check.outputs.deb_ubuntu_distros }}"
          dd_c="${{ steps.check.outputs.deb_debian_count }}"
          dd_d="${{ steps.check.outputs.deb_debian_distros }}"
          rc="${{ steps.check.outputs.rpm_count }}"
          rd="${{ steps.check.outputs.rpm_distros }}"
          ac="${{ steps.check.outputs.arch_count }}"

          arch_cell="❌ 0"
          if [[ -n "$ac" && "$ac" != "0" ]]; then
            arch_cell="✅ $ac"
          fi

          deb_ubuntu_cell="❌ 0"
          if [[ -n "$du_c" && "$du_c" != "0" ]]; then
            deb_ubuntu_cell="✅ $du_c"
            [[ -n "$du_d" ]] && deb_ubuntu_cell="✅ $du_c ($du_d)"
          fi

          deb_debian_cell="❌ 0"
          if [[ -n "$dd_c" && "$dd_c" != "0" ]]; then
            deb_debian_cell="✅ $dd_c"
            [[ -n "$dd_d" ]] && deb_debian_cell="✅ $dd_c ($dd_d)"
          fi

          rpm_cell="❌ 0"
          if [[ -n "$rc" && "$rc" != "0" ]]; then
            rpm_cell="✅ $rc"
            [[ -n "$rd" ]] && rpm_cell="✅ $rc ($rd)"
          fi

          BODY=$(cat <<EOF
          Release v$V (commit ${{ github.sha }})

          | Артефакт | Собрано | Описание |
          |:---|:---:|---|
          | \`*-sharun.AppImage\` | $SHR | quick-sharun — свой glibc и рантайм, GPU-стек в бандле |
          | \`.pkg.tar.zst\` | $arch_cell | Arch Linux. Установка: \`pacman -U iptvplayer-*.pkg.tar.zst\` |
          | \`.deb\` (Ubuntu) | $deb_ubuntu_cell | Собран на Ubuntu 24.04. Проверен в CI на Ubuntu 26.04. |
          | \`.deb\` (Debian) | $deb_debian_cell | Собран на Debian 13. Проверен в CI на Debian 13. |
          | \`.rpm\` | $rpm_cell | Собран на Rocky 10. Проверен в CI на Rocky 10 и Fedora 44. |

          ### Какой пакет выбрать

          <sub>Собранные пакеты могут теоретически работать и на других системах того же семейства с glibc не ниже версии сборочного контейнера.</sub>

          **Arch Linux** → \`iptvplayer-*.pkg.tar.zst\` (установка через \`pacman -U\`)

          **Ubuntu 24.04+, Linux Mint 22+** (glibc 2.39) → \`iptvplayer_*_ubuntu-24.04_amd64.deb\`

          **Debian 13+** (glibc 2.41) → \`iptvplayer_*_debian-13_amd64.deb\`

          **RHEL 10+, Rocky 10+, Alma 10+, Fedora 40+** (glibc 2.39) → \`iptvplayer-*.rocky-10.x86_64.rpm\`

          **Любая Linux x86_64** (в т.ч. старые glibc, musl-дистрибутивы, NixOS) → \`*-sharun.AppImage\`
          EOF
          )

          {
            echo "body<<EOF"
            printf '%s\n' "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check.outputs.have_artifacts == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', needs.version.outputs.version) }}
          name: Release v${{ needs.version.outputs.version }}
          body: ${{ steps.body.outputs.body }}
          files: |
            dist/*-sharun.AppImage
            dist/*-sharun.AppImage.zsync
            dist/*.pkg.tar.zst
            dist/*.deb
            dist/*.rpm
            dist/*.asc
            dist/checksums.txt
            dist/public-key.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup GPG
        if: always()
        uses: ./.github/actions/cleanup-gpg