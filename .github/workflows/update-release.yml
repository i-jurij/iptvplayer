name: Update release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Релиз, который обновляем (например, v0.1.4)'
        required: true
        type: string
      native_run_id:
        description: 'Run ID workflow-а Native packages. Пусто = последний успешный, 0 = пропустить native.'
        required: false
        type: string
      windows_run_id:
        description: 'Run ID workflow-а Windows-package-build. Пусто = последний успешный, 0 = пропустить Windows.'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  native-packages:
    if: inputs.native_run_id != '0'
    runs-on: ubuntu-latest
    steps:
      # Локальный composite action ./.github/actions/import-gpg доступен только после checkout.
      - uses: actions/checkout@v5
        
      - name: Resolve run-id
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RID="${{ inputs.native_run_id }}"
          if [ -n "$RID" ]; then
            echo "[i] native_run_id=$RID"
            echo "run_id=$RID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RID=$(gh run list --repo "${{ github.repository }}" \
                  --workflow "Native packages" \
                  --status success --limit 1 \
                  --json databaseId --jq '.[0].databaseId')
          [ -n "$RID" ] || { echo "::error::не найден успешный run Native packages"; exit 1; }
          echo "[i] авто: последний успешный Native packages = $RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

      - name: Download native artifacts
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify we got something
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(dist/*.deb dist/*.rpm)
          (( ${#pkgs[@]} > 0 )) || { echo "::error::нечего обновлять"; exit 1; }
          ls -la dist/

      - name: Import GPG key
        id: gpg
        uses: ./.github/actions/import-gpg
        with:
          private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase:  ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign native packages
        if: steps.gpg.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in dist/*.deb; do
            if command -v debsigs >/dev/null 2>&1; then
              debsigs --sign=origin --default-key="$GPG_KEY_ID" "$f" \
                || gpg --yes --detach-sign --armor -u "$GPG_KEY_ID" -o "$f.asc" "$f" || true
            else
              gpg --yes --detach-sign --armor -u "$GPG_KEY_ID" -o "$f.asc" "$f" || true
            fi
          done

          if command -v rpm >/dev/null 2>&1; then
            REAL_GPG="$(command -v gpg)"
            # --passphrase-file НЕ добавляем: его подставит wrapper из PATH.
            SIGN_CMD='%{__gpg} --batch --pinentry-mode loopback -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}'
            for f in dist/*.rpm; do
              rpm --addsign \
                  --define "_gpg_name $GPG_KEY_ID" \
                  --define "_signature gpg" \
                  --define "__gpg $REAL_GPG" \
                  --define "__gpg_check_password_cmd /bin/true" \
                  --define "__gpg_sign_cmd $SIGN_CMD" \
                  "$f" 2>/dev/null \
                || gpg --yes --detach-sign --armor -u "$GPG_KEY_ID" -o "$f.asc" "$f" || true
            done
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup GPG
        if: always()
        uses: ./.github/actions/cleanup-gpg

  resolve-version:
    if: inputs.windows_run_id != '0'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::tag должен начинаться с 'v' и цифры, получено: $TAG"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  resolve-windows:
    if: inputs.windows_run_id != '0'
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.r.outputs.run_id }}
    steps:
      - name: Resolve windows run
        id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RID="${{ inputs.windows_run_id }}"
          if [ -n "$RID" ]; then
            echo "[i] windows_run_id=$RID"
            echo "run_id=$RID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RID=$(gh run list --repo "${{ github.repository }}" \
                  --workflow "Windows-package-build" \
                  --status success --limit 1 \
                  --json databaseId --jq '.[0].databaseId')
          [ -n "$RID" ] || { echo "::error::не найден успешный run Windows-package-build"; exit 1; }
          echo "[i] авто: последний успешный Windows-package-build = $RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

  windows:
    needs: [resolve-version, resolve-windows]
    if: inputs.windows_run_id != '0'
    uses: ./.github/workflows/windows-packages.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      tag: ${{ inputs.tag }}
      reuse_run_id: ${{ needs.resolve-windows.outputs.run_id }}
      upload_to_release: true