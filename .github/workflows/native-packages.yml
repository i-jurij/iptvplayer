name: Native packages

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON-массив имён таргетов'
        required: false
        type: string
        default: '["ubuntu-24.04","debian-13","rocky-10"]'
    secrets:
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false
  workflow_dispatch:
    inputs:
      targets:
        description: 'Что собрать'
        required: true
        type: choice
        options:
          - '["ubuntu-24.04","debian-13","rocky-10"]'
          - '["ubuntu-24.04"]'
          - '["debian-13"]'
          - '["rocky-10"]'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail

          # Единый реестр известных таргетов. Пользователь подаёт только
          # имена — маппинг на образ/пакетный менеджер задан здесь, чтобы
          # нельзя было случайно передать произвольный контейнер.
          ALL='{
            "ubuntu-24.04": {"family":"deb","container":"ubuntu:24.04","pkgmgr":"apt"},
            "debian-13":    {"family":"deb","container":"debian:13","pkgmgr":"apt"},
            "rocky-10":     {"family":"rpm","container":"rockylinux/rockylinux:10","pkgmgr":"dnf"}
          }'

          MATRIX=$(jq -cn --argjson targets "$TARGETS" --argjson all "$ALL" '
            {
              include: ($targets | map(
                . as $t
                | if $all[$t] == null
                  then error("unknown target: " + $t)
                  else
                    { target: $t,
                      family: $all[$t].family,
                      container: $all[$t].container,
                      pkgmgr: $all[$t].pkgmgr }
                  end
              ))
            }')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    container:
      image: ${{ matrix.container }}
      options: --user root
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Cache third_party per-target. Ubuntu, Debian and Rocky have different
      # glibc, so wxWidgets .a files are built separately for each.
      - uses: actions/cache@v5
        with:
          path: third_party
          key: ${{ matrix.target }}-third_party-${{ hashFiles('scripts/cmd/deps.sh', 'scripts/lib.sh', 'scripts/distros/*.sh') }}

      # Install build toolchain + runtime deps via the workflow YAML (not via
      # make.sh --deps) — CI images are prepared in advance; make.sh in
      # NON_INTERACTIVE skips deps_ensure_for_build entirely.
      - name: Install build toolchain
        run: |
          set -euo pipefail
          if [ "${{ matrix.pkgmgr }}" = "apt" ]; then
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              build-essential cmake git autoconf automake libtool pkg-config \
              wget curl ca-certificates file xz-utils dpkg-dev fakeroot \
              gnupg debsigs gettext
          elif [ "${{ matrix.pkgmgr }}" = "dnf" ]; then
            if grep -qiE '^(rhel|rocky|almalinux)' /etc/os-release; then
              dnf install -y dnf-plugins-core
              dnf config-manager --set-enabled crb 2>/dev/null || true
              dnf install -y epel-release || true
            fi
            dnf install -y gcc gcc-c++ make cmake git autoconf automake libtool \
              pkgconf-pkg-config wget curl ca-certificates file xz \
              rpm-build rpm-sign gnupg2 gettext
          fi

      - name: Install runtime + dev libs
        run: |
          set -euo pipefail
          if [ "${{ matrix.pkgmgr }}" = "apt" ]; then
            apt-get install -y --no-install-recommends \
              libmpv-dev libgtk-3-dev libgdk-pixbuf-2.0-dev \
              libcurl4-openssl-dev libjpeg-dev libexpat1-dev zlib1g-dev \
              libwebp-dev libfreetype-dev libpng-dev rapidjson-dev \
              libx11-dev libx11-xcb-dev libgl1-mesa-dev libegl1-mesa-dev
          elif [ "${{ matrix.pkgmgr }}" = "dnf" ]; then
            dnf install -y \
              mpv-libs-devel gtk3-devel gdk-pixbuf2-devel \
              libcurl-devel libjpeg-turbo-devel expat-devel zlib-devel \
              libwebp-devel freetype-devel libpng-devel rapidjson-devel \
              libX11-devel libxcb-devel mesa-libGL-devel mesa-libEGL-devel
          fi

      # Third_party only; system packages are already installed above.
      # --skip-system keeps deps_run from touching apt/dnf.
      - name: Build binary
        run: |
          set -euo pipefail
          chmod +x scripts/make.sh
          ./scripts/make.sh --deps --yes --skip-system
          ./scripts/make.sh --build --yes

      - name: Import GPG key
        id: gpg
        uses: ./.github/actions/import-gpg
        with:
          private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase:  ${{ secrets.GPG_PASSPHRASE }}

      # --native uses distros/<adapter>.sh: distro_build → pack_rpm/pack_deb.
      # The binary already exists, so package_run does not rebuild it.
      - name: Build native package
        run: |
          set -euo pipefail
          chmod +x scripts/make.sh
          ./scripts/make.sh --package --native --yes
          ls -la dist/

      - name: Upload native package
        uses: actions/upload-artifact@v5
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/*.${{ matrix.family }}
            dist/*.${{ matrix.family }}.asc
          retention-days: 3
          if-no-files-found: error

      - name: Cleanup GPG
        if: always()
        uses: ./.github/actions/cleanup-gpg