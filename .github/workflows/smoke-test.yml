name: Smoke test release

on:
  workflow_run:
    workflows: ["Release from VERSION"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (e.g. v0.1.4)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_run: ${{ steps.resolve.outputs.should_run }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            VERSION=$(gh api "/repos/$REPO/contents/VERSION?ref=$SHA" \
                        --jq '.content' 2>/dev/null \
                      | base64 -d 2>/dev/null | head -1 | tr -d '\n\r' || true)
            if [ -z "$VERSION" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "[i] VERSION на $SHA не найден — пропускаем"
              exit 0
            fi
            TAG="v$VERSION"
          fi

          for i in $(seq 1 24); do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "[i] релиз $TAG найден"
              exit 0
            fi
            sleep 5
          done
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "[i] релиз $TAG не найден — пропускаем"

  fetch:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ needs.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm' \
            --clobber
          ls -la dist/

      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # =========================================================================
  # AppImage: тестируем на 5 контейнерах.
  #
  # Два варианта AppImage:
  #   *-sharun.AppImage     — self-contained, всё бандлит сам;
  #   *.AppImage            — linuxdeploy, сознательно НЕ несёт libEGL/libOpenGL,
  #                           использует системный GPU-стек (иначе краши
  #                           на несовпадении с драйверами хоста).
  # Поэтому sharun проверяем без доп. зависимостей, а linuxdeploy —
  # после доустановки системного OpenGL/EGL.
  # =========================================================================
  smoke-appimage:
    needs: fetch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - 'ubuntu:26.04'
          - 'debian:13'
          - 'fedora:44'
          - 'rockylinux/rockylinux:10'
          - 'archlinux:latest'
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist

      - name: Install minimal stack
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              ca-certificates file xz-utils xvfb xfce4 desktop-file-utils
          elif command -v dnf >/dev/null; then
            if grep -qiE '^(rhel|rocky|almalinux)' /etc/os-release; then
              dnf install -y dnf-plugins-core
              dnf config-manager --set-enabled crb 2>/dev/null || true
              dnf install -y epel-release || true
            fi
            dnf install -y ca-certificates file xz gtk3 desktop-file-utils
            dnf install -y xorg-x11-server-Xvfb 2>/dev/null || true
            dnf install -y weston 2>/dev/null || true
            dnf group install -y "Xfce Desktop" 2>/dev/null \
              || dnf group install -y xfce-desktop 2>/dev/null || true
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm ca-certificates file xz xorg-server-xvfb \
              xfce4 desktop-file-utils
          fi

      - name: Extract AppImages
        run: |
          set -euo pipefail
          shopt -s nullglob
          APPIMAGES=(dist/*.AppImage)
          (( ${#APPIMAGES[@]} > 0 )) || { echo "::error::No AppImage"; exit 1; }

          for AI in "${APPIMAGES[@]}"; do
            chmod +x "$AI"
            DIR="extract-$(basename "$AI" .AppImage)"
            rm -rf "$DIR"
            mkdir -p "$DIR"
            ( cd "$DIR" && "../$AI" --appimage-extract >/dev/null )
          done
          ls -la

      # --- фаза 1: sharun, самодостаточный, без системных либ ---
      - name: Verify sharun AppImage (self-contained)
        run: |
          set -euo pipefail
          AI=$(ls dist/*-sharun.AppImage 2>/dev/null | head -1)
          [ -n "$AI" ] || { echo "::error::sharun AppImage не найден"; exit 1; }
          echo "=== $AI --version (no extra system libs) ==="
          OUT=$(APPIMAGE_EXTRACT_AND_RUN=1 "$AI" --version)
          echo "$OUT"
          echo "$OUT" | grep -qE '^iptvplayer [0-9]'

      # --- фаза 2: доустановить системный OpenGL/EGL для linuxdeploy ---
      # linuxdeploy-AppImage сознательно не несёт libEGL/libOpenGL:
      # приложение десктопное и должно использовать системный GPU-стек,
      # иначе — краши на несовпадении с драйверами хоста.
      - name: Install OpenGL/EGL system libraries
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get install -y --no-install-recommends \
              libgl1 libegl1 libopengl0 libglvnd0 libglx0 \
              libglx-mesa0 libgl1-mesa-dri libgbm1
          elif command -v dnf >/dev/null; then
            dnf install -y mesa-libGL mesa-libEGL mesa-dri-drivers \
                           libglvnd-glx libglvnd-egl libglvnd-opengl \
                           mesa-libgbm
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm mesa libglvnd
          fi

      # --- фаза 3: linuxdeploy, теперь с системным OpenGL ---
      - name: Verify linuxdeploy AppImage (uses system OpenGL)
        run: |
          set -euo pipefail
          AI=$(ls dist/*.AppImage 2>/dev/null | grep -v -- '-sharun' | head -1)
          [ -n "$AI" ] || { echo "::error::linuxdeploy AppImage не найден"; exit 1; }
          echo "=== $AI --version ==="
          OUT=$(APPIMAGE_EXTRACT_AND_RUN=1 "$AI" --version)
          echo "$OUT"
          echo "$OUT" | grep -qE '^iptvplayer [0-9]'

      - name: Verify resources (linuxdeploy)
        run: |
          set -euo pipefail
          AI=$(ls dist/*.AppImage | grep -v -- '-sharun' | head -1)
          [ -n "$AI" ] || { echo "::error::linuxdeploy AppImage не найден"; exit 1; }
          DIR="extract-$(basename "$AI" .AppImage)"
          test -f "$DIR/squashfs-root/usr/share/applications/iptvplayer.desktop"
          test -f "$DIR/squashfs-root/usr/share/icons/hicolor/scalable/apps/iptvplayer.svg"
          test -f "$DIR/squashfs-root/usr/share/iptvplayer/about.html"
          test -d "$DIR/squashfs-root/usr/share/iptvplayer/icons"

          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate "$DIR/squashfs-root/usr/share/applications/iptvplayer.desktop"
          fi

      - name: Dynamic check (Xvfb, fallback weston)
        run: |
          set -euo pipefail
          shopt -s nullglob
          APPIMAGES=(dist/*.AppImage)
          (( ${#APPIMAGES[@]} > 0 )) || { echo "::error::No AppImage"; exit 1; }

          HEADLESS_PID=""
          cleanup() { [ -n "$HEADLESS_PID" ] && kill "$HEADLESS_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          if command -v Xvfb >/dev/null 2>&1; then
            echo "[i] headless: Xvfb"
            Xvfb :99 -screen 0 1440x900x24 &
            HEADLESS_PID=$!
            export DISPLAY=:99
          elif command -v weston >/dev/null 2>&1; then
            echo "[i] headless: weston (Xvfb недоступен)"
            export XDG_RUNTIME_DIR=/tmp/weston-runtime
            mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
            weston --backend=headless-backend.so --socket=wayland-1 \
                   --width=1440 --height=900 &
            HEADLESS_PID=$!
            export WAYLAND_DISPLAY=wayland-1
            export GDK_BACKEND=wayland
            for _ in $(seq 1 20); do
              [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
              sleep 0.5
            done
          else
            echo "::error::ни Xvfb, ни weston недоступны"
            exit 1
          fi
          sleep 3

          declare -A RESULT
          FAILED=0

          for AI in "${APPIMAGES[@]}"; do
            case "$AI" in
              *-sharun.AppImage) VARIANT="sharun"      ;;
              *)                 VARIANT="linuxdeploy" ;;
            esac
            echo ""
            echo "=== [$VARIANT] $AI (15s run) ==="

            APPIMAGE_EXTRACT_AND_RUN=1 "$AI" &
            APP_PID=$!
            sleep 15

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::[$VARIANT] $AI crashed during startup"
              wait "$APP_PID" 2>/dev/null || true
              RESULT["$VARIANT"]="FAIL"
              FAILED=1
            else
              echo "[✓][$VARIANT] survived 15s"
              RESULT["$VARIANT"]="PASS"
              kill "$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
            fi
          done

          echo ""
          echo "==================== SUMMARY ===================="
          for V in sharun linuxdeploy; do
            printf "  %-12s : %s\n" "$V" "${RESULT[$V]:-SKIPPED (нет файла)}"
          done
          echo "================================================="
          exit "$FAILED"

  # =========================================================================
  # Нативные .deb / .rpm: установка и запуск в родных контейнерах
  #
  # target     — система, на которой тестируем (контейнер, лог).
  # pkg_distro — суффикс имени пакета, который ставим в этом контейнере.
  #              Он не всегда совпадает с target: например, .deb собирается
  #              на ubuntu-24.04, а проверяется ещё и на ubuntu-26.04;
  #              .rpm собирается на rocky-10 и ставится в fedora-44.
  # =========================================================================
  smoke-native:
    needs: fetch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: ubuntu-26.04, family: deb, container: 'ubuntu:26.04',             pkg_distro: ubuntu-24.04 }
          - { target: debian-13,    family: deb, container: 'debian:13',                pkg_distro: debian-13 }
          - { target: rocky-10,     family: rpm, container: 'rockylinux/rockylinux:10', pkg_distro: rocky-10 }
          - { target: fedora-44,    family: rpm, container: 'fedora:44',                pkg_distro: rocky-10 }
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist

      - name: Install desktop stack
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              ca-certificates file xz-utils xvfb xfce4 desktop-file-utils
          elif command -v dnf >/dev/null; then
            if grep -qiE '^(rhel|rocky|almalinux)' /etc/os-release; then
              dnf install -y dnf-plugins-core
              dnf config-manager --set-enabled crb 2>/dev/null || true
              dnf install -y epel-release || true
            fi
            dnf install -y ca-certificates file xz gtk3 desktop-file-utils
            dnf install -y xorg-x11-server-Xvfb 2>/dev/null || true
            dnf install -y weston 2>/dev/null || true
            dnf group install -y "Xfce Desktop" 2>/dev/null \
              || dnf group install -y xfce-desktop 2>/dev/null || true
          fi

      - name: Install package
        run: |
          set -euo pipefail
          case "${{ matrix.family }}" in
            deb) apt-get install -y ./dist/*.deb ;;
            rpm) dnf install -y ./dist/*.rpm ;;
          esac

      - name: Verify --version
        run: |
          set -euo pipefail
          OUT=$(/usr/bin/iptvplayer --version)
          echo "$OUT"
          echo "$OUT" | grep -qE '^iptvplayer [0-9]'

      - name: Verify resources
        run: |
          set -euo pipefail
          test -f /usr/share/applications/iptvplayer.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/iptvplayer.svg
          test -f /usr/share/iptvplayer/about.html
          test -d /usr/share/iptvplayer/icons
          test -f /usr/share/metainfo/io.github.i_jurij.iptvplayer.metainfo.xml

      - name: Validate .desktop
        run: |
          set -euo pipefail
          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate /usr/share/applications/iptvplayer.desktop
          else
            echo "[i] desktop-file-validate отсутствует"
          fi

      - name: Static check (ldd)
        run: |
          set -euo pipefail
          echo "=== ldd /usr/bin/iptvplayer ==="
          if ldd /usr/bin/iptvplayer 2>&1 | grep -q "not found"; then
            ldd /usr/bin/iptvplayer | grep "not found"
            exit 1
          fi
          echo "OK"

      - name: Dynamic check (Xvfb, fallback weston)
        run: |
          set -euo pipefail

          APP_PID=""; HEADLESS_PID=""
          cleanup() {
            [ -n "$APP_PID" ]      && kill "$APP_PID"      2>/dev/null || true
            [ -n "$HEADLESS_PID" ] && kill "$HEADLESS_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          if command -v Xvfb >/dev/null 2>&1; then
            echo "[i] headless: Xvfb"
            Xvfb :99 -screen 0 1440x900x24 &
            HEADLESS_PID=$!
            export DISPLAY=:99
          elif command -v weston >/dev/null 2>&1; then
            echo "[i] headless: weston (Xvfb недоступен)"
            export XDG_RUNTIME_DIR=/tmp/weston-runtime
            mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
            weston --backend=headless-backend.so --socket=wayland-1 \
                   --width=1440 --height=900 &
            HEADLESS_PID=$!
            export WAYLAND_DISPLAY=wayland-1
            export GDK_BACKEND=wayland
            for _ in $(seq 1 20); do
              [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
              sleep 0.5
            done
          else
            echo "::error::ни Xvfb, ни weston недоступны"
            exit 1
          fi
          sleep 3

          /usr/bin/iptvplayer &
          APP_PID=$!
          sleep 15
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::package binary crashed during startup"
            exit 1
          fi
          echo "[✓] survived 15s"