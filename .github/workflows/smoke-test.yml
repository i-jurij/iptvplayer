name: Smoke test release

on:
  workflow_run:
    workflows: ["Release from VERSION"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (e.g. v0.0.21)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Определяем, какой тег тестировать, и ждём появления релиза.
  # Для workflow_dispatch: берём inputs.tag.
  # Для workflow_run: читаем VERSION на коммите, который собрал release.yml,
  # и формируем тег v<VERSION>. Ждём до 2 минут, пока релиз появится в API
  # (обычно он уже там, т.к. release.yml завершился успешно).
  # Если релиза нет — считаем, что VERSION не менялся, и просто пропускаем
  # весь smoke-test (не падаем).
  # -----------------------------------------------------------------------
  resolve:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_run: ${{ steps.resolve.outputs.should_run }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            VERSION=$(gh api "/repos/$REPO/contents/VERSION?ref=$SHA" \
                        --jq '.content' 2>/dev/null \
                      | base64 -d 2>/dev/null \
                      | head -1 | tr -d '\n\r' || true)
            if [ -z "$VERSION" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "[i] не удалось прочитать VERSION на $SHA — пропускаем"
              exit 0
            fi
            TAG="v$VERSION"
          fi

          for i in $(seq 1 24); do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
              echo "should_run=true"    >> "$GITHUB_OUTPUT"
              echo "[i] релиз $TAG найден"
              exit 0
            fi
            sleep 5
          done

          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "[i] релиз $TAG не найден за 2 минуты (VERSION не менялся?) — пропускаем"

  # -----------------------------------------------------------------------
  # Скачиваем ассеты релиза на хосте (там есть gh и jq),
  # затем отдаём их в контейнерные матричные джобы через artifact.
  # -----------------------------------------------------------------------
  fetch:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ needs.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern '*.deb' --pattern '*.rpm' --pattern '*.AppImage' \
            --clobber
          ls -la dist/

      - name: Upload packages as artifact
        uses: actions/upload-artifact@v5
        with:
          name: packages
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Собственно smoke-test (та же матрица, что была раньше)
  # -----------------------------------------------------------------------
  smoke-test:
    needs: fetch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { container: 'ubuntu:26.04',             family: 'deb' }
          - { container: 'debian:13',                family: 'deb' }
          - { container: 'fedora:44',                family: 'rpm' }
          - { container: 'rockylinux/rockylinux:10', family: 'rpm' }
          - { container: 'archlinux:latest',         family: 'arch' }
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: packages
          path: dist

      - name: Install minimal desktop stack
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              ca-certificates file xz-utils xvfb xfce4
          elif command -v dnf >/dev/null; then
            if grep -qiE '^(rhel|rocky|almalinux)' /etc/os-release; then
              dnf install -y dnf-plugins-core || true
              dnf config-manager --set-enabled crb 2>/dev/null \
                || dnf config-manager setopt crb.enabled=1 2>/dev/null \
                || true
              dnf install -y epel-release || true
            fi
            dnf install -y ca-certificates file xz gtk3
            dnf install -y weston 2>/dev/null \
              || dnf install -y gnome-kiosk 2>/dev/null \
              || true
            dnf install -y xorg-x11-server-Xvfb 2>/dev/null || true
            dnf group install -y "Xfce Desktop" 2>/dev/null \
              || dnf group install -y xfce-desktop 2>/dev/null \
              || true
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm ca-certificates file xz xorg-server-xvfb xfce4 weston
          fi

      - name: Install package (deb / rpm / arch)
        run: |
          set -euo pipefail
          echo "=== Install package ==="
          case "${{ matrix.family }}" in
            deb)  apt-get install -y ./dist/*.deb ;;
            rpm)  dnf install -y ./dist/*.rpm ;;
            arch) echo "[i] Arch: нативный .pkg.tar.zst в артефактах нет, пропускаем установку пакета" ;;
          esac

      - name: Static check — package
        if: matrix.family != 'arch'
        run: |
          set -euo pipefail
          echo "=== ldd /opt/iptvplayer/usr/bin/iptvplayer ==="
          LL="/opt/iptvplayer/usr/lib:/opt/iptvplayer/usr/lib/fallback"
          if LD_LIBRARY_PATH="$LL" ldd /opt/iptvplayer/usr/bin/iptvplayer 2>&1 | grep -q "not found"; then
            LD_LIBRARY_PATH="$LL" ldd /opt/iptvplayer/usr/bin/iptvplayer | grep "not found"
            exit 1
          fi
          echo "OK"

      - name: Dynamic check — package
        if: matrix.family != 'arch'
        run: |
          set -euo pipefail
          echo "=== Run package binary ==="

          APP_PID=""
          XVFB_PID=""
          cleanup() {
            [ -n "$APP_PID" ]  && kill "$APP_PID"  2>/dev/null || true
            [ -n "$XVFB_PID" ] && kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          if command -v Xvfb >/dev/null 2>&1; then
            Xvfb :99 -screen 0 1440x900x24 &
            XVFB_PID=$!
            export DISPLAY=:99
          elif command -v weston >/dev/null 2>&1; then
            export XDG_RUNTIME_DIR=/tmp/weston-runtime
            mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
            weston --backend=headless-backend.so --socket=wayland-1 \
                   --width=1440 --height=900 &
            XVFB_PID=$!
            export WAYLAND_DISPLAY=wayland-1
            export GDK_BACKEND=wayland
            for _ in $(seq 1 20); do
              [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
              sleep 0.5
            done
          else
            echo "::error::ни Xvfb, ни weston недоступны"
            exit 1
          fi

          sleep 3
          /usr/bin/iptvplayer &
          APP_PID=$!
          sleep 15
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::package binary crashed during startup"
            exit 1
          fi
          echo "OK"

      - name: Extract AppImage and static check
        run: |
          set -euo pipefail
          APPIMAGE=$(ls dist/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          BIN="squashfs-root/usr/bin/iptvplayer"
          [ -f "$BIN" ] || BIN="squashfs-root/AppRun"
          chmod +x squashfs-root/AppRun squashfs-root/usr/bin/iptvplayer 2>/dev/null || true
          echo "=== ldd $BIN ==="
          LL="squashfs-root/usr/lib:squashfs-root/usr/lib/fallback"
          if LD_LIBRARY_PATH="$LL" ldd "$BIN" 2>&1 | grep -q "not found"; then
            LD_LIBRARY_PATH="$LL" ldd "$BIN" | grep "not found"
            exit 1
          fi
          echo "OK"

      - name: Dynamic check — AppImage
        run: |
          set -euo pipefail
          echo "=== Run AppImage ==="
          APPIMAGE=$(ls dist/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          chmod +x squashfs-root/AppRun squashfs-root/usr/bin/iptvplayer 2>/dev/null || true

          APP_PID=""
          XVFB_PID=""
          cleanup() {
            [ -n "$APP_PID" ]  && kill "$APP_PID"  2>/dev/null || true
            [ -n "$XVFB_PID" ] && kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          if command -v Xvfb >/dev/null 2>&1; then
            Xvfb :99 -screen 0 1440x900x24 &
            XVFB_PID=$!
            export DISPLAY=:99
          elif command -v weston >/dev/null 2>&1; then
            export XDG_RUNTIME_DIR=/tmp/weston-runtime
            mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
            weston --backend=headless-backend.so --socket=wayland-1 \
                   --width=1440 --height=900 &
            XVFB_PID=$!
            export WAYLAND_DISPLAY=wayland-1
            export GDK_BACKEND=wayland
            for _ in $(seq 1 20); do
              [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
              sleep 0.5
            done
          else
            echo "::error::ни Xvfb, ни weston недоступны"
            exit 1
          fi

          sleep 3
          ./squashfs-root/AppRun &
          APP_PID=$!
          sleep 15
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::AppImage crashed during startup"
            exit 1
          fi
          echo "OK"

  # -----------------------------------------------------------------------
  # Обновляем notes релиза реальными результатами smoke-test.
  # В подробном виде показываем только упавшие/пропущенные ячейки,
  # чтобы не засорять описание релиза.
  # -----------------------------------------------------------------------
  report:
    needs: [resolve, fetch, smoke-test]
    if: |
      always() &&
      needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Compose and update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ needs.resolve.outputs.tag }}
          REPO:     ${{ github.repository }}
          RUN_ID:   ${{ github.run_id }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          JOBS=$(gh api "/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate)

          # Все ячейки матрицы: TSV name<TAB>conclusion<TAB>url
          ALL=$(echo "$JOBS" | jq -r '
            .jobs[]
            | select(.name | startswith("smoke-test ("))
            | [.name, .conclusion, .html_url] | @tsv
          ')

          if [ -z "$ALL" ]; then
            BLOCK="> 🧪 Smoke test: **_no cells ran_** — see [$RUN_URL]($RUN_URL)"
          else
            TOTAL=$(echo "$ALL" | wc -l)
            PASSED=$(echo "$ALL" | awk -F'\t' '$2=="success"' | wc -l)
            FAILED=$(( TOTAL - PASSED ))

            if [ "$FAILED" -eq 0 ]; then
              BLOCK="> 🧪 Smoke test: **✅ all $TOTAL passed** — [$RUN_URL]($RUN_URL)"
            else
              HEADER="> 🧪 Smoke test: **❌ $FAILED/$TOTAL failed**"
              TABLE=$'| Target | Result |\n| :--- | :--- |'
              while IFS=$'\t' read -r name concl url; do
                [ "$concl" = "success" ] && continue
                case "$concl" in
                  failure)   ICON="❌" ;;
                  cancelled) ICON="⏹" ;;
                  skipped)   ICON="⏭" ;;
                  *)         ICON="❔" ;;
                esac
                TARGET=$(printf '%s' "$name" | sed -E 's/^smoke-test \(//; s/\)$//')
                TABLE="$TABLE"$'\n'"| \`$TARGET\` | [$ICON $concl]($url) |"
              done <<< "$ALL"
              BLOCK="$HEADER"$'\n\n'"$TABLE"$'\n\n'"Full run: [$RUN_URL]($RUN_URL)"
            fi
          fi

          OLD=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)

          BASE=$(printf '%s\n' "$OLD" | awk '
            /^<!-- SMOKE-TEST-BEGIN -->$/ { skip=1; next }
            /^<!-- SMOKE-TEST-END -->$/   { skip=0; next }
            !skip
          ')

          {
            printf '%s\n' "$BASE"
            printf '\n<!-- SMOKE-TEST-BEGIN -->\n%s\n<!-- SMOKE-TEST-END -->\n' "$BLOCK"
          } > /tmp/notes.md

          gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/notes.md