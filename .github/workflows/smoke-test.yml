name: Smoke test release

on:
  workflow_run:
    workflows: ["Release from VERSION"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (e.g. v0.1.4)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_run: ${{ steps.resolve.outputs.should_run }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            VERSION=$(gh api "/repos/$REPO/contents/VERSION?ref=$SHA" \
                        --jq '.content' 2>/dev/null \
                      | base64 -d 2>/dev/null | head -1 | tr -d '\n\r' || true)
            if [ -z "$VERSION" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "[i] VERSION на $SHA не найден — пропускаем"
              exit 0
            fi
            TAG="v$VERSION"
          fi

          for i in $(seq 1 24); do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "[i] релиз $TAG найден"
              exit 0
            fi
            sleep 5
          done
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "[i] релиз $TAG не найден — пропускаем"

  fetch:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ needs.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm' \
            --pattern '*.pkg.tar.zst' \
            --pattern '*.asc' --pattern 'public-key.asc' \
            --clobber
          ls -la dist/

      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # =========================================================================
  # AppImage (sharun): 5 контейнеров = 5 отдельных строк в UI.
  #
  # Единственный релизный вариант — quick-sharun. Несёт свой glibc и
  # рантайм, GPU-стек в бандле (OpenGL/EGL/Vulkan + mesa ICD). Работает
  # на старых glibc и musl-дистрибутивах.
  #
  # linuxdeploy-вариант в релиз не попадает и здесь не тестируется.
  # =========================================================================
  smoke-appimage:
    needs: fetch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - 'ubuntu:26.04'
          - 'debian:13'
          - 'fedora:44'
          - 'rockylinux/rockylinux:10'
          - 'archlinux:latest'
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist

      - name: Install minimal stack
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              ca-certificates file xz-utils xvfb xfce4 desktop-file-utils
          elif command -v dnf >/dev/null; then
            if grep -qiE '^(rhel|rocky|almalinux)' /etc/os-release; then
              dnf install -y dnf-plugins-core
              dnf config-manager --set-enabled crb 2>/dev/null || true
              dnf install -y epel-release || true
            fi
            dnf install -y ca-certificates file xz gtk3 desktop-file-utils
            dnf install -y xorg-x11-server-Xvfb 2>/dev/null || true
            dnf install -y weston 2>/dev/null || true
            dnf group install -y "Xfce Desktop" 2>/dev/null \
              || dnf group install -y xfce-desktop 2>/dev/null || true
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm ca-certificates file xz xorg-server-xvfb \
              xfce4 desktop-file-utils
          fi

      - name: Install OpenGL/EGL system libraries
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get install -y --no-install-recommends \
              libgl1 libegl1 libopengl0 libglvnd0 libglx0 \
              libglx-mesa0 libgl1-mesa-dri libgbm1
          elif command -v dnf >/dev/null; then
            dnf install -y mesa-libGL mesa-libEGL mesa-dri-drivers \
                           libglvnd-glx libglvnd-egl libglvnd-opengl \
                           mesa-libgbm
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm mesa libglvnd
          fi

      - name: Pick AppImage
        id: pick
        run: |
          set -euo pipefail
          shopt -s nullglob
          AIS=(dist/*-sharun.AppImage)
          (( ${#AIS[@]} > 0 )) || { echo "::error::sharun AppImage не найден"; exit 1; }
          AI="${AIS[0]}"
          chmod +x "$AI"
          echo "ai=$AI" >> "$GITHUB_OUTPUT"
          echo "[i] выбран $AI"

      - name: Verify --version
        run: |
          set -euo pipefail
          AI="${{ steps.pick.outputs.ai }}"
          echo "=== $AI --version ==="
          OUT=$(APPIMAGE_EXTRACT_AND_RUN=1 "$AI" --version)
          echo "$OUT"
          echo "$OUT" | grep -qE '^iptvplayer [0-9]'

      - name: Dynamic check (Xvfb, fallback weston)
        run: |
          set -euo pipefail
          AI="${{ steps.pick.outputs.ai }}"

          HEADLESS_PID=""
          cleanup() { [ -n "$HEADLESS_PID" ] && kill "$HEADLESS_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          if command -v Xvfb >/dev/null 2>&1; then
            echo "[i] headless: Xvfb"
            Xvfb :99 -screen 0 1440x900x24 &
            HEADLESS_PID=$!
            export DISPLAY=:99
          elif command -v weston >/dev/null 2>&1; then
            echo "[i] headless: weston (Xvfb недоступен)"
            export XDG_RUNTIME_DIR=/tmp/weston-runtime
            mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
            weston --backend=headless-backend.so --socket=wayland-1 \
                   --width=1440 --height=900 &
            HEADLESS_PID=$!
            export WAYLAND_DISPLAY=wayland-1
            export GDK_BACKEND=wayland
            for _ in $(seq 1 20); do
              [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
              sleep 0.5
            done
          else
            echo "::error::ни Xvfb, ни weston недоступны"
            exit 1
          fi
          sleep 3

          echo "=== $AI (15s run) ==="
          APPIMAGE_EXTRACT_AND_RUN=1 "$AI" &
          APP_PID=$!
          sleep 15

          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::$AI crashed during startup"
            wait "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          echo "[✓] survived 15s"
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true

  # =========================================================================
  # Нативные .deb / .rpm: установка, статические проверки и динамический
  # запуск /usr/bin/iptvplayer. Каждый пакет — отдельная строка в UI.
  # =========================================================================
  smoke-native:
    needs: fetch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { family: deb, target: ubuntu-26.04, container: 'ubuntu:26.04',             pkg_distro: ubuntu-24.04 }
          - { family: deb, target: debian-13,    container: 'debian:13',                pkg_distro: debian-13 }
          - { family: rpm, target: rocky-10,     container: 'rockylinux/rockylinux:10', pkg_distro: rocky-10 }
          - { family: rpm, target: fedora-44,    container: 'fedora:44',                pkg_distro: rocky-10 }
          - { family: arch, target: arch,        container: 'archlinux:latest',         pkg_distro: arch }
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist

      - name: Install desktop stack
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              ca-certificates file xz-utils xvfb xfce4 desktop-file-utils
          elif command -v dnf >/dev/null; then
            if grep -qiE '^(rhel|rocky|almalinux)' /etc/os-release; then
              dnf install -y dnf-plugins-core
              dnf config-manager --set-enabled crb 2>/dev/null || true
              dnf install -y epel-release || true
            fi
            dnf install -y ca-certificates file xz gtk3 desktop-file-utils
            dnf install -y xorg-x11-server-Xvfb 2>/dev/null || true
            dnf install -y weston 2>/dev/null || true
            dnf group install -y "Xfce Desktop" 2>/dev/null \
              || dnf group install -y xfce-desktop 2>/dev/null || true
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed \
              ca-certificates file xz zstd \
              xorg-server-xvfb xfce4 desktop-file-utils
          fi

      - name: Install OpenGL/EGL/Vulkan system libraries
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get install -y --no-install-recommends \
              libgl1 libegl1 libopengl0 libglvnd0 libglx0 \
              libglx-mesa0 libgl1-mesa-dri libgbm1 libvulkan1
          elif command -v dnf >/dev/null; then
            dnf install -y mesa-libGL mesa-libEGL mesa-dri-drivers \
                           libglvnd-glx libglvnd-egl libglvnd-opengl \
                           mesa-libgbm vulkan-loader
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm mesa libglvnd vulkan-icd-loader
          fi

      - name: Install package
        run: |
          set -euo pipefail
          case "${{ matrix.family }}" in
            deb) apt-get install -y ./dist/*.deb ;;
            rpm) dnf install -y ./dist/*.rpm ;;
            pacman -U --noconfirm --assume-installed jack2 ./dist/*.pkg.tar.zst
          esac

      - name: Verify --version
        run: |
          set -euo pipefail
          OUT=$(/usr/bin/iptvplayer --version)
          echo "$OUT"
          echo "$OUT" | grep -qE '^iptvplayer [0-9]'

      - name: Verify resources
        run: |
          set -euo pipefail
          test -f /usr/share/applications/iptvplayer.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/iptvplayer.svg
          test -f /usr/share/iptvplayer/about.html
          test -d /usr/share/iptvplayer/icons
          test -f /usr/share/metainfo/io.github.i_jurij.iptvplayer.metainfo.xml

      - name: Validate .desktop
        run: |
          set -euo pipefail
          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate /usr/share/applications/iptvplayer.desktop
          else
            echo "[i] desktop-file-validate отсутствует"
          fi

      - name: Static check (ldd)
        run: |
          set -euo pipefail
          echo "=== ldd /usr/bin/iptvplayer ==="
          if ldd /usr/bin/iptvplayer 2>&1 | grep -q "not found"; then
            ldd /usr/bin/iptvplayer | grep "not found"
            exit 1
          fi
          echo "OK"

      - name: Dynamic check (Xvfb, fallback weston)
        run: |
          set -euo pipefail

          HEADLESS_PID=""
          cleanup() { [ -n "$HEADLESS_PID" ] && kill "$HEADLESS_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          if command -v Xvfb >/dev/null 2>&1; then
            echo "[i] headless: Xvfb"
            Xvfb :99 -screen 0 1440x900x24 &
            HEADLESS_PID=$!
            export DISPLAY=:99
          elif command -v weston >/dev/null 2>&1; then
            echo "[i] headless: weston"
            export XDG_RUNTIME_DIR=/tmp/weston-runtime
            mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
            weston --backend=headless-backend.so --socket=wayland-1 \
                   --width=1440 --height=900 &
            HEADLESS_PID=$!
            export WAYLAND_DISPLAY=wayland-1
            export GDK_BACKEND=wayland
            for _ in $(seq 1 20); do
              [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
              sleep 0.5
            done
          else
            echo "::error::ни Xvfb, ни weston недоступны"
            exit 1
          fi
          sleep 3

          echo "=== [/usr/bin/iptvplayer] (15s run) ==="
          /usr/bin/iptvplayer &
          APP_PID=$!
          sleep 15

          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::/usr/bin/iptvplayer crashed during startup"
            wait "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          echo "[✓] iptvplayer survived 15s"
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true

      - name: Verify package signature (informational)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          shopt -s nullglob

          # --- инструменты для проверки ---------------------------------
          if command -v apt-get >/dev/null 2>&1; then
            if ! command -v debsigs >/dev/null 2>&1; then
              apt-get install -y --no-install-recommends debsigs >/dev/null 2>&1 \
                || echo "::warning::не удалось поставить debsigs — проверка встроенной подписи .deb пропущена"
            fi
            if ! command -v gpg >/dev/null 2>&1; then
              apt-get install -y --no-install-recommends gnupg >/dev/null 2>&1 \
                || echo "::warning::не удалось поставить gnupg — проверка .asc пропущена"
            fi
          elif command -v dnf >/dev/null 2>&1; then
            if ! command -v gpg >/dev/null 2>&1; then
              dnf install -y gnupg2 >/dev/null 2>&1 \
                || echo "::warning::не удалось поставить gnupg2 — проверка .asc пропущена"
            fi
          elif command -v pacman >/dev/null 2>&1; then
            if ! command -v gpg >/dev/null 2>&1; then
              pacman -S --noconfirm --needed gnupg >/dev/null 2>&1 \
                || echo "::warning::не удалось поставить gnupg — проверка .asc пропущена"
            fi
          fi

          # --- импорт публичного ключа ---------------------------------
          if [ -f dist/public-key.asc ] && command -v gpg >/dev/null 2>&1; then
            if gpg --import dist/public-key.asc >/dev/null 2>&1; then
              echo "[i] публичный ключ импортирован из dist/public-key.asc"
            else
              echo "::warning::не удалось импортировать dist/public-key.asc"
            fi
          else
            echo "::warning::dist/public-key.asc отсутствует — проверка подписи будет неполной"
          fi

          # --- проверка по семейству -----------------------------------
          case "${{ matrix.family }}" in
            deb)
              for f in dist/*.deb; do
                [ -f "$f" ] || continue
                base="$(basename "$f")"
                echo ""
                echo "=== [$base] встроенная подпись (debsigs) ==="
                if command -v debsigs >/dev/null 2>&1; then
                  if debsigs --verify "$f"; then
                    echo "[✓] debsigs --verify OK"
                  else
                    echo "::warning::debsigs --verify не подтвердил $base"
                  fi
                else
                  echo "::warning::debsigs недоступен — проверка встроенной подписи пропущена"
                fi

                echo "=== [$base.asc] внешняя подпись ==="
                if [ -f "$f.asc" ] && command -v gpg >/dev/null 2>&1; then
                  if gpg --verify "$f.asc" "$f" 2>/dev/null; then
                    echo "[✓] gpg --verify OK"
                  else
                    echo "::warning::gpg --verify не подтвердил $base.asc"
                  fi
                else
                  echo "::warning::$base.asc отсутствует — внешней подписи нет"
                fi
              done
              ;;
            rpm)
              for f in dist/*.rpm; do
                [ -f "$f" ] || continue
                base="$(basename "$f")"
                echo ""
                echo "=== [$base] встроенная подпись (rpm --checksig) ==="
                sig_out="$(rpm --checksig "$f" 2>&1 || true)"
                echo "$sig_out"
                if echo "$sig_out" | grep -q 'signatures OK'; then
                  echo "[✓] rpm --checksig OK"
                else
                  echo "::warning::rpm --checksig не подтвердил $base"
                fi

                echo "=== [$base.asc] внешняя подпись ==="
                if [ -f "$f.asc" ] && command -v gpg >/dev/null 2>&1; then
                  if gpg --verify "$f.asc" "$f" 2>/dev/null; then
                    echo "[✓] gpg --verify OK"
                  else
                    echo "::warning::gpg --verify не подтвердил $base.asc"
                  fi
                else
                  echo "::warning::$base.asc отсутствует — внешней подписи нет"
                fi
              done
              ;;
              arch)
              # .pkg.tar.zst не имеет встроенной подписи, которую понимал бы
              # pacman без настройки SigLevel. Проверяем только внешний .asc.
              for f in dist/*.pkg.tar.zst; do
                [ -f "$f" ] || continue
                base="$(basename "$f")"
                echo ""
                echo "=== [$base.asc] внешняя подпись ==="
                if [ -f "$f.asc" ] && command -v gpg >/dev/null 2>&1; then
                  if gpg --verify "$f.asc" "$f" 2>/dev/null; then
                    echo "[✓] gpg --verify OK"
                  else
                    echo "::warning::gpg --verify не подтвердил $base.asc"
                  fi
                else
                  echo "::warning::$base.asc отсутствует — внешней подписи нет"
                fi
              done
              ;;
            *)
              echo "::warning::неизвестное семейство '${{ matrix.family }}' — проверка подписи пропущена"
              ;;
          esac