name: Smoke test release

on:
  # Автоматически — сразу после публикации релиза (в т.ч. из release.yml)
  release:
    types: [published]
  # Вручную — по тегу любого существующего релиза
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (e.g. v0.0.21)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Скачиваем ассеты релиза на хосте (там есть gh и jq),
  # затем отдаём их в контейнерные матричные джобы через artifact.
  # -----------------------------------------------------------------------
  fetch:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          mkdir -p dist
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern '*.deb' --pattern '*.rpm' --pattern '*.AppImage' \
            --clobber
          ls -la dist/

      - name: Upload packages as artifact
        uses: actions/upload-artifact@v5
        with:
          name: packages
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Собственно smoke-test (та же матрица, что была в release.yml)
  # -----------------------------------------------------------------------
  smoke-test:
    needs: fetch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { container: 'ubuntu:26.04',             family: 'deb' }
          - { container: 'debian:13',                family: 'deb' }
          - { container: 'fedora:44',                family: 'rpm' }
          - { container: 'rockylinux/rockylinux:10', family: 'rpm' }
          - { container: 'archlinux:latest',         family: 'arch' }
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: packages
          path: .

      - name: Install minimal desktop stack
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              ca-certificates file xz-utils xvfb xfce4
          elif command -v dnf >/dev/null; then
            if grep -qiE '^(rhel|rocky|almalinux)' /etc/os-release; then
              dnf install -y dnf-plugins-core || true
              dnf config-manager --set-enabled crb 2>/dev/null \
                || dnf config-manager setopt crb.enabled=1 2>/dev/null \
                || true
              dnf install -y epel-release || true
            fi
            dnf install -y ca-certificates file xz gtk3
            dnf install -y weston 2>/dev/null \
              || dnf install -y gnome-kiosk 2>/dev/null \
              || true
            dnf install -y xorg-x11-server-Xvfb 2>/dev/null || true
            dnf group install -y "Xfce Desktop" 2>/dev/null \
              || dnf group install -y xfce-desktop 2>/dev/null \
              || true
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm ca-certificates file xz xorg-server-xvfb xfce4 weston
          fi

      - name: Install package (deb / rpm / arch)
        run: |
          set -euo pipefail
          echo "=== Install package ==="
          case "${{ matrix.family }}" in
            deb)  apt-get install -y ./dist/*.deb ;;
            rpm)  dnf install -y ./dist/*.rpm ;;
            arch) echo "[i] Arch: нативный .pkg.tar.zst в артефактах нет, пропускаем установку пакета" ;;
          esac

      - name: Static check — package
        if: matrix.family != 'arch'
        run: |
          set -euo pipefail
          echo "=== ldd /opt/iptvplayer/usr/bin/iptvplayer ==="
          LL="/opt/iptvplayer/usr/lib:/opt/iptvplayer/usr/lib/fallback"
          if LD_LIBRARY_PATH="$LL" ldd /opt/iptvplayer/usr/bin/iptvplayer 2>&1 | grep -q "not found"; then
            LD_LIBRARY_PATH="$LL" ldd /opt/iptvplayer/usr/bin/iptvplayer | grep "not found"
            exit 1
          fi
          echo "OK"

      - name: Dynamic check — package
        if: matrix.family != 'arch'
        run: |
          set -euo pipefail
          echo "=== Run package binary ==="

          APP_PID=""
          XVFB_PID=""
          cleanup() {
            [ -n "$APP_PID" ]  && kill "$APP_PID"  2>/dev/null || true
            [ -n "$XVFB_PID" ] && kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          if command -v Xvfb >/dev/null 2>&1; then
            Xvfb :99 -screen 0 1440x900x24 &
            XVFB_PID=$!
            export DISPLAY=:99
          elif command -v weston >/dev/null 2>&1; then
            export XDG_RUNTIME_DIR=/tmp/weston-runtime
            mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
            weston --backend=headless-backend.so --socket=wayland-1 \
                   --width=1440 --height=900 &
            XVFB_PID=$!
            export WAYLAND_DISPLAY=wayland-1
            export GDK_BACKEND=wayland
            for _ in $(seq 1 20); do
              [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
              sleep 0.5
            done
          else
            echo "::error::ни Xvfb, ни weston недоступны"
            exit 1
          fi

          sleep 3
          /usr/bin/iptvplayer &
          APP_PID=$!
          sleep 15
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::package binary crashed during startup"
            exit 1
          fi
          echo "OK"

      - name: Extract AppImage and static check
        run: |
          set -euo pipefail
          APPIMAGE=$(ls dist/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          BIN="squashfs-root/usr/bin/iptvplayer"
          [ -f "$BIN" ] || BIN="squashfs-root/AppRun"
          chmod +x squashfs-root/AppRun squashfs-root/usr/bin/iptvplayer 2>/dev/null || true
          echo "=== ldd $BIN ==="
          LL="squashfs-root/usr/lib:squashfs-root/usr/lib/fallback"
          if LD_LIBRARY_PATH="$LL" ldd "$BIN" 2>&1 | grep -q "not found"; then
            LD_LIBRARY_PATH="$LL" ldd "$BIN" | grep "not found"
            exit 1
          fi
          echo "OK"

      - name: Dynamic check — AppImage
        run: |
          set -euo pipefail
          echo "=== Run AppImage ==="
          APPIMAGE=$(ls dist/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          chmod +x squashfs-root/AppRun squashfs-root/usr/bin/iptvplayer 2>/dev/null || true

          APP_PID=""
          XVFB_PID=""
          cleanup() {
            [ -n "$APP_PID" ]  && kill "$APP_PID"  2>/dev/null || true
            [ -n "$XVFB_PID" ] && kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          if command -v Xvfb >/dev/null 2>&1; then
            Xvfb :99 -screen 0 1440x900x24 &
            XVFB_PID=$!
            export DISPLAY=:99
          elif command -v weston >/dev/null 2>&1; then
            export XDG_RUNTIME_DIR=/tmp/weston-runtime
            mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
            weston --backend=headless-backend.so --socket=wayland-1 \
                   --width=1440 --height=900 &
            XVFB_PID=$!
            export WAYLAND_DISPLAY=wayland-1
            export GDK_BACKEND=wayland
            for _ in $(seq 1 20); do
              [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
              sleep 0.5
            done
          else
            echo "::error::ни Xvfb, ни weston недоступны"
            exit 1
          fi

          sleep 3
          ./squashfs-root/AppRun &
          APP_PID=$!
          sleep 15
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::AppImage crashed during startup"
            exit 1
          fi
          echo "OK"