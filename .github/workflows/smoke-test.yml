name: Smoke test release

on:
  workflow_run:
    workflows: ["Release from VERSION"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (e.g. v0.1.4)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_run: ${{ steps.resolve.outputs.should_run }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            VERSION=$(gh api "/repos/$REPO/contents/VERSION?ref=$SHA" \
                        --jq '.content' 2>/dev/null \
                      | base64 -d 2>/dev/null | head -1 | tr -d '\n\r' || true)
            if [ -z "$VERSION" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "[i] VERSION на $SHA не найден — пропускаем"
              exit 0
            fi
            TAG="v$VERSION"
          fi

          for i in $(seq 1 24); do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "[i] релиз $TAG найден"
              exit 0
            fi
            sleep 5
          done
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "[i] релиз $TAG не найден — пропускаем"

  fetch:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ needs.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm' \
            --clobber
          ls -la dist/

      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # =========================================================================
  # AppImage: тестируем на 5 контейнерах
  # =========================================================================
  smoke-appimage:
    needs: fetch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - 'ubuntu:26.04'
          - 'debian:13'
          - 'fedora:44'
          - 'rockylinux/rockylinux:10'
          - 'archlinux:latest'
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist

      - name: Install minimal stack
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              ca-certificates file xz-utils xvfb xfce4 desktop-file-utils
          elif command -v dnf >/dev/null; then
            if grep -qiE '^(rhel|rocky|almalinux)' /etc/os-release; then
              dnf install -y dnf-plugins-core
              dnf config-manager --set-enabled crb 2>/dev/null || true
              dnf install -y epel-release || true
            fi
            dnf install -y ca-certificates file xz gtk3 desktop-file-utils
            dnf install -y xorg-x11-server-Xvfb 2>/dev/null || true
            dnf group install -y "Xfce Desktop" 2>/dev/null \
              || dnf group install -y xfce-desktop 2>/dev/null || true
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm ca-certificates file xz xorg-server-xvfb \
              xfce4 desktop-file-utils
          fi

      - name: Extract AppImages
        run: |
          set -euo pipefail
          shopt -s nullglob
          APPIMAGES=(dist/*.AppImage)
          (( ${#APPIMAGES[@]} > 0 )) || { echo "::error::No AppImage"; exit 1; }

          for AI in "${APPIMAGES[@]}"; do
            chmod +x "$AI"
            DIR="extract-$(basename "$AI" .AppImage)"
            rm -rf "$DIR"
            mkdir -p "$DIR"
            ( cd "$DIR" && "../$AI" --appimage-extract >/dev/null )
          done
          ls -la

      - name: Verify --version
        run: |
          set -euo pipefail
          shopt -s nullglob
          APPIMAGES=(dist/*.AppImage)
          for AI in "${APPIMAGES[@]}"; do
            echo "=== $AI --version ==="
            OUT=$(APPIMAGE_EXTRACT_AND_RUN=1 "$AI" --version)
            echo "$OUT"
            echo "$OUT" | grep -qE '^iptvplayer [0-9]'
          done

      - name: Verify resources (linuxdeploy)
        run: |
          set -euo pipefail
          AI=$(ls dist/*.AppImage | grep -v -- '-sharun' | head -1)
          [ -n "$AI" ] || { echo "::error::linuxdeploy AppImage не найден"; exit 1; }
          DIR="extract-$(basename "$AI" .AppImage)"
          test -f "$DIR/squashfs-root/usr/share/applications/iptvplayer.desktop"
          test -f "$DIR/squashfs-root/usr/share/icons/hicolor/scalable/apps/iptvplayer.svg"
          test -f "$DIR/squashfs-root/usr/share/iptvplayer/about.html"
          test -d "$DIR/squashfs-root/usr/share/iptvplayer/icons"

          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate "$DIR/squashfs-root/usr/share/applications/iptvplayer.desktop"
          fi

      - name: Dynamic check under Xvfb
        run: |
          set -euo pipefail
          shopt -s nullglob
          APPIMAGES=(dist/*.AppImage)

          XVFB_PID=""
          cleanup() { [ -n "$XVFB_PID" ] && kill "$XVFB_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          if command -v Xvfb >/dev/null 2>&1; then
            Xvfb :99 -screen 0 1440x900x24 &
            XVFB_PID=$!
            export DISPLAY=:99
          else
            echo "::error::Xvfb недоступен"
            exit 1
          fi
          sleep 3

          FAILED=0
          for AI in "${APPIMAGES[@]}"; do
            echo ""
            echo "=== $AI (15s run) ==="
            APPIMAGE_EXTRACT_AND_RUN=1 "$AI" &
            APP_PID=$!
            sleep 15
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::$AI crashed during startup"
              wait "$APP_PID" 2>/dev/null || true
              FAILED=1
            else
              echo "[✓] survived 15s"
              kill "$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
            fi
          done
          exit "$FAILED"

  # =========================================================================
  # Нативные .deb / .rpm: установка и запуск в родных контейнерах
  # =========================================================================
  smoke-native:
    needs: fetch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: ubuntu-26.04, family: deb, container: 'ubuntu:26.04' }
          - { target: debian-13,    family: deb, container: 'debian:13' }
          - { target: rocky-10,     family: rpm, container: 'rockylinux/rockylinux:10' }
          - { target: fedora-44,    family: rpm, container: 'fedora:44' }
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist

      - name: Install desktop stack
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              ca-certificates file xz-utils xvfb xfce4 desktop-file-utils
          elif command -v dnf >/dev/null; then
            if grep -qiE '^(rhel|rocky|almalinux)' /etc/os-release; then
              dnf install -y dnf-plugins-core
              dnf config-manager --set-enabled crb 2>/dev/null || true
              dnf install -y epel-release || true
            fi
            dnf install -y ca-certificates file xz gtk3 desktop-file-utils
            dnf install -y xorg-x11-server-Xvfb 2>/dev/null || true
            dnf group install -y "Xfce Desktop" 2>/dev/null \
              || dnf group install -y xfce-desktop 2>/dev/null || true
          fi

      - name: Install package
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "${{ matrix.family }}" in
            deb)
              PKG=(dist/*.deb)
              (( ${#PKG[@]} > 0 )) || { echo "::error::No .deb"; exit 1; }
              apt-get install -y "${PKG[@]}"
              ;;
            rpm)
              PKG=(dist/*.rpm)
              (( ${#PKG[@]} > 0 )) || { echo "::error::No .rpm"; exit 1; }
              dnf install -y "${PKG[@]}"
              ;;
          esac

      - name: Verify --version
        run: |
          set -euo pipefail
          OUT=$(/usr/bin/iptvplayer --version)
          echo "$OUT"
          echo "$OUT" | grep -qE '^iptvplayer [0-9]'

      - name: Verify resources
        run: |
          set -euo pipefail
          test -f /usr/share/applications/iptvplayer.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/iptvplayer.svg
          test -f /usr/share/iptvplayer/about.html
          test -d /usr/share/iptvplayer/icons
          test -f /usr/share/metainfo/io.github.i_jurij.iptvplayer.metainfo.xml

      - name: Validate .desktop
        run: |
          set -euo pipefail
          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate /usr/share/applications/iptvplayer.desktop
          else
            echo "[i] desktop-file-validate отсутствует"
          fi

      - name: Static check (ldd)
        run: |
          set -euo pipefail
          echo "=== ldd /usr/bin/iptvplayer ==="
          if ldd /usr/bin/iptvplayer 2>&1 | grep -q "not found"; then
            ldd /usr/bin/iptvplayer | grep "not found"
            exit 1
          fi
          echo "OK"

      - name: Dynamic check under Xvfb
        run: |
          set -euo pipefail

          XVFB_PID=""; APP_PID=""
          cleanup() {
            [ -n "$APP_PID" ]  && kill "$APP_PID"  2>/dev/null || true
            [ -n "$XVFB_PID" ] && kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          if command -v Xvfb >/dev/null 2>&1; then
            Xvfb :99 -screen 0 1440x900x24 &
            XVFB_PID=$!
            export DISPLAY=:99
          else
            echo "::error::Xvfb недоступен"
            exit 1
          fi
          sleep 3

          /usr/bin/iptvplayer &
          APP_PID=$!
          sleep 15
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::package binary crashed during startup"
            exit 1
          fi
          echo "[✓] survived 15s"